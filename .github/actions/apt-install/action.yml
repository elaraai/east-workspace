name: Install apt packages
description: >-
  Bounds apt on a Linux runner, and installs packages with it, tried again. A
  bare `apt-get update` waited on one stalled download of a failing mirror
  until its job's 90 minutes ran out; here a try that stalls is stopped within
  minutes, and the next one usually finds the mirror answering. The bounds are
  written to apt's own configuration, so they hold for every apt-get on the
  runner from this step on: a later step's too, and a tool's that runs apt-get
  itself.

inputs:
  packages:
    description: >-
      The packages to install, separated by spaces or lines. None, to bound
      apt alone for a later step that runs apt-get itself.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Bound apt and install packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        # Every package named, across spaces and lines
        read -r -d '' -a packages <<< "$PACKAGES" || true

        # apt's own limits, for every apt-get on this runner from here on: a
        # connection that sends nothing for 30 seconds is dropped, each
        # download is tried three times, and the dpkg lock is waited for two
        # minutes.
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "120";' |
          sudo tee /etc/apt/apt.conf.d/99-ci-bounds > /dev/null
        if [ "${#packages[@]}" -eq 0 ]; then
          echo "apt is bounded for the steps that follow; no package was asked for"
          exit 0
        fi

        # A command as root, stopped after `$1` seconds whatever it waits on
        bounded() { sudo timeout --signal=TERM --kill-after=30 "$@"; }
        # One try, whole: the lists read again, so a try that failed on stale
        # lists does not fail the next; a package a stopped try left half set
        # up, set up; then the packages.
        attempt() {
          bounded 120 apt-get update &&
            bounded 300 dpkg --configure -a &&
            bounded 300 apt-get install -y "${packages[@]}"
        }
        # Three tries, a little further apart each time
        for try in 1 2 3; do
          if attempt; then exit 0; fi
          echo "::warning::installing ${packages[*]} failed or stalled (try $try of 3)"
          if [ "$try" -lt 3 ]; then sleep $((try * 15)); fi
        done
        echo "::error::installing ${packages[*]} failed three times"
        exit 1
