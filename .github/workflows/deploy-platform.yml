name: Deploy Platform

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: 'Deployment config name (from cdk/platform/deployments/)'
        required: true
        type: choice
        options:
          - elara-dev
          - kpmg
      runner:
        description: 'Runner image action (before CDK deploy)'
        required: true
        type: choice
        default: none
        options:
          - none
          - build
          - transfer from elara-dev
          - transfer from kpmg

permissions:
  id-token: write
  contents: read

jobs:
  runner:
    name: Runner (${{ inputs.runner }})
    runs-on: ubuntu-latest
    if: inputs.runner != 'none'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: inputs.runner == 'build'
        with:
          node-version: 22

      - name: Read deployment config
        id: config
        run: |
          CONFIG_FILE="cdk/platform/deployments/${{ inputs.deployment }}.json"
          echo "role_arn=$(jq -r '.github.deployRoleArn' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "region=$(jq -r '.aws.region' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "account_id=$(jq -r '.aws.accountId' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$(jq -r '.deployment.id' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"

      # --- Build from source ---

      - name: Build packages
        if: inputs.runner == 'build'
        run: npm ci && npm run build

      - name: Authenticate to deployment account (build)
        if: inputs.runner == 'build'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Build and push runner image
        if: inputs.runner == 'build'
        run: |
          ECR_URI="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/e3-${{ steps.config.outputs.deployment_id }}-runner"
          aws ecr get-login-password --region ${{ steps.config.outputs.region }} | \
            docker login --username AWS --password-stdin ${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com
          docker build --pull -f docker/Dockerfile.runner -t "$ECR_URI:latest" --provenance=false .
          docker push "$ECR_URI:latest"
          aws lambda update-function-code \
            --function-name "e3-${{ steps.config.outputs.deployment_id }}-execute-task" \
            --image-uri "$ECR_URI:latest" \
            --region ${{ steps.config.outputs.region }}

      # --- Transfer from another environment ---

      - name: Determine source environment
        id: transfer
        if: startsWith(inputs.runner, 'transfer from ')
        run: |
          SOURCE_ENV="${{ inputs.runner }}"
          SOURCE_ENV="${SOURCE_ENV#transfer from }"
          echo "source_env=$SOURCE_ENV" >> "$GITHUB_OUTPUT"
          CONFIG_FILE="cdk/platform/deployments/${SOURCE_ENV}.json"
          echo "source_role_arn=$(jq -r '.github.deployRoleArn' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "source_region=$(jq -r '.aws.region' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "source_account_id=$(jq -r '.aws.accountId' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "source_deployment_id=$(jq -r '.deployment.id' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"

      - name: Authenticate to source account (transfer)
        if: startsWith(inputs.runner, 'transfer from ')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.transfer.outputs.source_role_arn }}
          aws-region: ${{ steps.transfer.outputs.source_region }}

      - name: Pull image from source ECR
        if: startsWith(inputs.runner, 'transfer from ')
        run: |
          SOURCE_ECR_URI="${{ steps.transfer.outputs.source_account_id }}.dkr.ecr.${{ steps.transfer.outputs.source_region }}.amazonaws.com/e3-${{ steps.transfer.outputs.source_deployment_id }}-runner"
          aws ecr get-login-password --region ${{ steps.transfer.outputs.source_region }} | \
            docker login --username AWS --password-stdin ${{ steps.transfer.outputs.source_account_id }}.dkr.ecr.${{ steps.transfer.outputs.source_region }}.amazonaws.com
          docker pull "$SOURCE_ECR_URI:latest"

      - name: Authenticate to target account (transfer)
        if: startsWith(inputs.runner, 'transfer from ')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Push image to target ECR and update Lambda
        if: startsWith(inputs.runner, 'transfer from ')
        run: |
          SOURCE_ECR_URI="${{ steps.transfer.outputs.source_account_id }}.dkr.ecr.${{ steps.transfer.outputs.source_region }}.amazonaws.com/e3-${{ steps.transfer.outputs.source_deployment_id }}-runner"
          TARGET_ECR_URI="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/e3-${{ steps.config.outputs.deployment_id }}-runner"
          aws ecr get-login-password --region ${{ steps.config.outputs.region }} | \
            docker login --username AWS --password-stdin ${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com
          docker tag "$SOURCE_ECR_URI:latest" "$TARGET_ECR_URI:latest"
          docker push "$TARGET_ECR_URI:latest"
          aws lambda update-function-code \
            --function-name "e3-${{ steps.config.outputs.deployment_id }}-execute-task" \
            --image-uri "$TARGET_ECR_URI:latest" \
            --region ${{ steps.config.outputs.region }}

  deploy:
    name: Deploy ${{ inputs.deployment }}
    runs-on: ubuntu-latest
    needs: [runner]
    if: ${{ !cancelled() && (needs.runner.result == 'success' || needs.runner.result == 'skipped') }}
    # Uncomment and configure GitHub Environments for approval gates:
    # environment: ${{ inputs.deployment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read deployment config
        id: config
        run: |
          CONFIG_FILE="cdk/platform/deployments/${{ inputs.deployment }}.json"
          echo "role_arn=$(jq -r '.github.deployRoleArn' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "region=$(jq -r '.aws.region' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ steps.config.outputs.region }}

      - run: npm ci
      - run: npm run build

      - name: CDK Deploy
        working-directory: cdk/platform
        run: npx cdk deploy --context config=${{ inputs.deployment }} --require-approval never
