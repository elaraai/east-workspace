name: Test east-py

on:
  push:
    branches: [main]
    paths:
      - "libs/east-py/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-c/**"
      - ".github/workflows/test-east-py.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/east-py/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-c/**"
      - ".github/workflows/test-east-py.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-east-py:
    name: Test east-py (core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build and export east test IR
        working-directory: libs/east
        run: make test-export
        env:
          EXPORT_TEST_IR: /tmp/east-test-ir

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install Python dependencies
        working-directory: libs/east-py
        run: make install

      - name: Lint
        working-directory: libs/east-py
        run: make lint

      - name: Type check
        working-directory: libs/east-py
        run: make typecheck

      - name: Run east-py compliance tests
        working-directory: libs/east-py
        run: make test-east-py

  test-east-py-std:
    name: Test east-py-std
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Start test services
        run: docker compose -f docker/services/docker-compose.yml --profile services up -d --wait

      - name: Build east-node and export std test IR
        working-directory: libs/east-node
        run: make build && make test-export-std
        env:
          EXPORT_TEST_IR: /tmp/east-node-std

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install Python dependencies
        working-directory: libs/east-py
        run: make install

      - name: Run east-py-std compliance tests
        working-directory: libs/east-py
        run: make test-east-py-std

      - name: Stop test services
        if: always()
        run: docker compose -f docker/services/docker-compose.yml --profile services down -v

  test-east-py-io:
    name: Test east-py-io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node
        working-directory: libs/east-node
        run: make build

      - name: Start test services
        run: docker compose -f docker/services/docker-compose.yml --profile services up -d --wait

      - name: Export test IR from east-node-io
        working-directory: libs/east-node
        run: make test-export-io
        timeout-minutes: 5
        env:
          EXPORT_TEST_IR: /tmp/east-node-io

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install Python dependencies
        working-directory: libs/east-py
        run: make install

      - name: Run east-py-io compliance tests
        working-directory: libs/east-py
        run: make test-east-py-io

      - name: Stop test services
        if: always()
        run: docker compose -f docker/services/docker-compose.yml --profile services down -v

  test-east-py-datascience:
    name: Test east-py-datascience
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        working-directory: libs/east-node
        run: make build

      - name: Build east-py-datascience
        working-directory: libs/east-py/packages/east-py-datascience
        run: make build

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install Python dependencies
        working-directory: libs/east-py
        run: make install

      - name: Run east-py-datascience tests
        working-directory: libs/east-py
        run: make test-east-py-datascience
