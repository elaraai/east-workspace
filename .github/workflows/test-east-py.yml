name: Test east-py

on:
  push:
    branches: [main]
    paths:
      - "libs/east-py/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-c/**"
      - ".github/workflows/test-east-py.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/east-py/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-c/**"
      - ".github/workflows/test-east-py.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Export the compliance IR once on Linux (the TS export tooling is Unix-only),
  # then share it so the win/mac legs don't re-run it. Mirrors test-east-c.yml.
  export-ir:
    name: Export east IR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - name: Export east IR
        run: pnpm --filter @elaraai/east run test:export
      - uses: actions/upload-artifact@v4
        with:
          name: ir-east
          path: /tmp/east-test-ir/
          if-no-files-found: error

  test-east-py:
    name: Test east-py core (${{ matrix.os }})
    needs: export-ir
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows so the build/test steps share one shell on all OSes.
        shell: bash
    env:
      UV_PYTHON: "3.11"
      # Ninja avoids scikit-build's default multi-config VS generator on Windows
      # (deep TryCompile paths overflow MAX_PATH); ninja comes from build-deps.
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install C build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install C build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Download east IR
        uses: actions/download-artifact@v4
        with:
          name: ir-east
          path: ir-east

      # Build east-py's native Cython extension (links east-c in-process via
      # scikit-build-core). Replicates `make install`'s no-build-isolation flow
      # directly so it runs without make on Windows runners.
      - name: Build east-py
        working-directory: libs/east-py
        run: |
          uv venv
          uv pip install scikit-build-core cython numpy setuptools ninja
          uv sync --all-packages --no-build-isolation \
            --reinstall-package elaraai-east-py --refresh-package elaraai-east-py

      - name: Run east-py core compliance
        working-directory: libs/east-py
        run: uv run --package elaraai-east-py python packages/east-py/tests/test_compliance.py --ir-dir "$GITHUB_WORKSPACE/ir-east"

  test-east-py-std:
    name: Test east-py-std
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Start test services
        run: docker compose -f docker/services/docker-compose.yml --profile services up -d --wait

      - name: Build east-node and export std test IR
        working-directory: libs/east-node
        run: make build && make test-export-std
        env:
          EXPORT_TEST_IR: /tmp/east-node-std

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install Python dependencies
        working-directory: libs/east-py
        run: make install

      - name: Run east-py-std compliance tests
        working-directory: libs/east-py
        run: make test-east-py-std

      - name: Stop test services
        if: always()
        run: docker compose -f docker/services/docker-compose.yml --profile services down -v

  test-east-py-io:
    name: Test east-py-io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node
        working-directory: libs/east-node
        run: make build

      - name: Start test services
        run: docker compose -f docker/services/docker-compose.yml --profile services up -d --wait

      - name: Export test IR from east-node-io
        working-directory: libs/east-node
        run: make test-export-io
        timeout-minutes: 5
        env:
          EXPORT_TEST_IR: /tmp/east-node-io

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install Python dependencies
        working-directory: libs/east-py
        run: make install

      - name: Run east-py-io compliance tests
        working-directory: libs/east-py
        run: make test-east-py-io

      - name: Stop test services
        if: always()
        run: docker compose -f docker/services/docker-compose.yml --profile services down -v

  test-east-py-datascience:
    name: Test east-py-datascience
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        working-directory: libs/east-node
        run: make build

      - name: Build east-py-datascience
        working-directory: libs/east-py/packages/east-py-datascience
        run: make build

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install Python dependencies
        working-directory: libs/east-py
        run: make install

      - name: Run east-py-datascience tests
        working-directory: libs/east-py
        run: make test-east-py-datascience
