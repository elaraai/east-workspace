name: Test east-py

on:
  push:
    branches: [main]
    paths:
      - "libs/east-py/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-c/**"
      - ".github/workflows/test-east-py.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/east-py/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-c/**"
      - ".github/workflows/test-east-py.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Export the compliance IR once on Linux (the TS export tooling is Unix-only),
  # then share it so the win/mac legs don't re-run it. Mirrors test-east-c.yml.
  export-ir:
    name: Export test IR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      # The TS export tooling is Unix-only (VAR=val node, /tmp); run it once here
      # and share via artifacts so the win/mac legs don't re-run it.
      - name: Export IR (east + east-node-std + east-py-datascience)
        run: |
          pnpm --filter @elaraai/east run test:export
          pnpm --filter @elaraai/east run export:examples
          pnpm --filter @elaraai/east-node-std run test:export
          pnpm --filter @elaraai/east-py-datascience run test:export
      - uses: actions/upload-artifact@v4
        with:
          name: ir-east
          path: /tmp/east-test-ir/
          if-no-files-found: error
      # Every *.examples.ts example as IR + inputs + returns — the examples leg
      # of the IR → python → IR conformance round trip (#627).
      - uses: actions/upload-artifact@v4
        with:
          name: ir-examples
          path: /tmp/east-examples-ir/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ir-std
          path: /tmp/east-node-std/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ir-datascience
          path: /tmp/east-py-datascience/
          if-no-files-found: error

  test-east-py:
    name: Test east-py (${{ matrix.os }})
    needs: export-ir
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows so the build/test steps share one shell on all OSes.
        shell: bash
    env:
      UV_PYTHON: "3.11"
      # Ninja avoids scikit-build's default multi-config VS generator on Windows
      # (deep TryCompile paths overflow MAX_PATH); ninja comes from build-deps.
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install C build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install C build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Download east IR
        uses: actions/download-artifact@v4
        with:
          name: ir-east
          path: ir-east

      # Build east-py's native Cython extension (links east-c in-process via
      # scikit-build-core). Replicates `make install`'s no-build-isolation flow
      # directly so it runs without make on Windows runners.
      - name: Build east-py
        working-directory: libs/east-py
        run: |
          uv venv
          uv pip install scikit-build-core cython numpy setuptools ninja
          uv sync --all-packages --no-build-isolation \
            --reinstall-package elaraai-east-py --refresh-package elaraai-east-py

      - name: Run east-py compliance
        working-directory: libs/east-py
        run: uv run --package elaraai-east-py python packages/east-py/tests/test_compliance.py --ir-dir "$GITHUB_WORKSPACE/ir-east"

      # The WHOLE tests/ tree — the expression-builder suites, the eager-replay
      # differential and its ratchets included (#531: these were dormant
      # while only tests/serialization ran) — except tests/conformance, which
      # is the `conformance` job below: the IR → python → IR round trip over
      # the corpus takes longer than this job's budget on its own. The
      # exported IR is staged into the temp dir the corpus-driven suites read
      # (python's gettempdir, so the path agrees with the MSYS-rewritten one
      # on Windows).
      - name: Run east-py tests (full pytest sweep)
        working-directory: libs/east-py/packages/east-py
        env:
          IR_SRC: ${{ github.workspace }}/ir-east
        run: |
          uv run python -c "import os, shutil, tempfile, pathlib; d = pathlib.Path(tempfile.gettempdir()) / 'east-test-ir'; d.mkdir(parents=True, exist_ok=True); [shutil.copy(p, d) for p in pathlib.Path(os.environ['IR_SRC']).glob('*.json')]"
          uv run pytest tests -q --no-cov --ignore=tests/conformance

      # Runner streaming execution (--emit / --stream) through run_program,
      # against the checked-in cross-runner IR fixtures (#507).
      - name: Run east-py-cli tests
        working-directory: libs/east-py/packages/east-py-cli
        run: uv run pytest tests -q --no-cov

  # The IR → python → IR conformance round trip (#627), REQUIRED: every
  # compliance-corpus program and every exported example prints as python,
  # rebuilds, normalizes equal (east-c's `east_ir_normalize`) and — the corpus
  # with EAST_CONFORMANCE_EXECUTE=1 — runs its compliance suite identically to
  # the original. Its own job: the corpus round trip alone is ~40 minutes on a
  # runner, and EAST_CONFORMANCE_REQUIRED=1 turns a missing IR directory into a
  # failure instead of a silent skip (the legs used to skip wherever the temp
  # dir did not match the default path, which is every OS but Linux).
  conformance:
    name: IR ↔ python conformance (corpus executed + examples)
    needs: export-ir
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      UV_PYTHON: "3.11"
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Download east IR
        uses: actions/download-artifact@v4
        with:
          name: ir-east
          path: ir-east

      - name: Download examples IR
        uses: actions/download-artifact@v4
        with:
          name: ir-examples
          path: ir-examples

      - name: Build east-py
        working-directory: libs/east-py
        run: |
          uv venv
          uv pip install scikit-build-core cython numpy setuptools ninja
          uv sync --all-packages --no-build-isolation \
            --reinstall-package elaraai-east-py --refresh-package elaraai-east-py

      - name: Round trip the corpus (executed) and every example
        working-directory: libs/east-py/packages/east-py
        env:
          EAST_TEST_IR_DIR: ${{ github.workspace }}/ir-east
          EAST_EXAMPLES_IR_DIR: ${{ github.workspace }}/ir-examples
          EAST_CONFORMANCE_EXECUTE: "1"
          EAST_CONFORMANCE_REQUIRED: "1"
        run: uv run pytest tests/conformance -q --no-cov

  test-east-py-std:
    name: Test east-py-std (${{ matrix.os }})
    needs: export-ir
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: "3.11"
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install C build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install C build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      # go-httpbin serves the fetch suite on :8085 (the URL baked into the std
      # IR) — same as test-east-c.yml, so no Docker on any OS.
      - name: Use Go (for go-httpbin)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download std IR
        uses: actions/download-artifact@v4
        with:
          name: ir-std
          path: ir-std

      - name: Build east-py
        working-directory: libs/east-py
        run: |
          uv venv
          uv pip install scikit-build-core cython numpy setuptools ninja
          uv sync --all-packages --no-build-isolation \
            --reinstall-package elaraai-east-py --refresh-package elaraai-east-py

      - name: Start httpbin (go-httpbin :8085)
        run: |
          go install github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@v2.18.3
          "$(go env GOPATH)/bin/go-httpbin" -port 8085 &
          for ((i = 0; i < 30; i++)); do
            curl -sf http://localhost:8085/get >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8085/get >/dev/null

      # The fs compliance IR bakes the export host's tmpdir (/tmp/...); on
      # Windows the runtime resolves that to <drive>:\tmp, so create it (mirrors
      # test-east-c.yml).
      - name: Ensure temp dir exists (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: if not exist \tmp mkdir \tmp

      - name: Run east-py-std compliance
        working-directory: libs/east-py
        run: uv run --package elaraai-east-py-std python packages/east-py/tests/test_compliance.py --ir-dir "$GITHUB_WORKSPACE/ir-std" -p east_py_std

  test-east-py-io:
    name: Test east-py-io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node
        working-directory: libs/east-node
        run: make build

      - name: Start test services
        run: docker compose -f docker/services/docker-compose.yml --profile services up -d --wait

      - name: Export test IR from east-node-io
        working-directory: libs/east-node
        run: make test-export-io
        timeout-minutes: 5
        env:
          EXPORT_TEST_IR: /tmp/east-node-io

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install Python dependencies
        working-directory: libs/east-py
        run: make install

      - name: Run east-py-io compliance tests
        working-directory: libs/east-py
        run: make test-east-py-io

      - name: Stop test services
        if: always()
        run: docker compose -f docker/services/docker-compose.yml --profile services down -v

  test-east-py-datascience:
    name: Test east-py-datascience (${{ matrix.os }})
    needs: export-ir
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: "3.11"
      CMAKE_GENERATOR: Ninja
      # Force PyTorch Lightning onto CPU. macos-14 is Apple Silicon, so "auto"
      # would pick the MPS GPU backend, but MPS is unusable on the headless
      # runner (allocations fail). No CI runner has a usable GPU, so CPU is the
      # correct, deterministic choice everywhere.
      EAST_LIGHTNING_ACCELERATOR: cpu

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install C build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install C build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Download datascience IR
        uses: actions/download-artifact@v4
        with:
          name: ir-datascience
          path: ir-datascience

      # --all-extras pulls every ML/optimization backend. On Windows/macOS-arm
      # some (e.g. PyNomadBBO, pymc) may lack wheels; fail-fast:false keeps the
      # ubuntu leg green while the others surface exactly what's missing.
      - name: Build east-py-datascience (+ ML extras)
        working-directory: libs/east-py
        run: |
          uv venv
          uv pip install scikit-build-core cython numpy setuptools ninja
          uv sync --all-extras --all-packages --no-build-isolation \
            --reinstall-package elaraai-east-py --refresh-package elaraai-east-py \
            --reinstall-package elaraai-east-py-datascience --refresh-package elaraai-east-py-datascience

      - name: Run east-py-datascience compliance
        working-directory: libs/east-py
        run: uv run --package elaraai-east-py-datascience python packages/east-py/tests/test_compliance.py --ir-dir "$GITHUB_WORKSPACE/ir-datascience" -p east_py_datascience
