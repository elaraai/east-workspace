name: Plugin Artifacts

# Verifies the one committed plugin artifact, libs/east-plugin/index.json, is
# current, and that both agent plugins assemble as a marketplace installs them
# (#1309): the plugins are published to npm by the release and listed by the
# catalog (elaraai/plugins); nothing else generated is committed. Skills are
# symlinks from libs/east-plugin/skills into the in-tree lib SKILL.md files,
# and the index is regenerated from the monorepo (no repo cloning).

on:
  push:
    branches: [main]
    paths:
      - 'libs/**/SKILL.md'
      - 'libs/**/*.examples.ts'
      - 'libs/**/*.examples.tsx'
      - 'libs/east-plugin/**'
      - 'libs/east-codex-plugin/**'
      - 'libs/east-claude-plugin/**'
      - 'libs/east/src/codegen/**'
      - 'libs/east-py/packages/east-py/east/codegen/**'
      - '.github/workflows/plugin-artifacts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'libs/**/SKILL.md'
      - 'libs/**/*.examples.ts'
      - 'libs/**/*.examples.tsx'
      - 'libs/east-plugin/**'
      - 'libs/east-codex-plugin/**'
      - 'libs/east-claude-plugin/**'
      - 'libs/east/src/codegen/**'
      - 'libs/east-py/packages/east-py/east/codegen/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-diagnostics (dependency)
        working-directory: libs/east-diagnostics
        run: make build

      # The index stores every program example as its IR and both printings
      # (#654): the generator imports the packages' BUILT example modules, and
      # the python printing needs east-py.
      - name: Build east-node (example modules)
        working-directory: libs/east-node
        run: make build

      - name: Build east-py-datascience (example modules)
        run: pnpm --filter @elaraai/east-py-datascience run build

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install east-py (the python printer)
        working-directory: libs/east-py
        run: uv sync --all-packages

      - name: Regenerate search index
        working-directory: libs/east-plugin
        run: make index

      - name: Fail if the index is stale
        run: |
          if ! git diff --quiet -- libs/east-plugin/index.json; then
            echo "::error::libs/east-plugin/index.json is out of date. Run make -C libs/east-plugin index and commit it."
            git --no-pager diff --stat -- libs/east-plugin/index.json
            exit 1
          fi
          echo "The index is current."

      # Both plugins as a marketplace installs them, from this tree: bundles,
      # skills as real files, the index, a dependency-free package.json.
      - name: Assemble both agent plugins
        working-directory: libs/east-plugin
        run: make package

      - name: The assembled plugins publish as they are
        run: node scripts/publish-plugins.mjs latest --dry-run

      - name: Nothing generated is committed
        run: |
          stray="$(git ls-files libs/east-claude-plugin libs/east-codex-plugin | grep -E '(^|/)(\.build/|index\.json$|index\.config\.json$|index\.static\.json$|skills/)' || true)"
          if [ -n "$stray" ]; then
            echo "::error::Generated plugin artifacts are committed under the host plugins:"
            echo "$stray"
            exit 1
          fi
          echo "No generated artifact is committed under the host plugins."
