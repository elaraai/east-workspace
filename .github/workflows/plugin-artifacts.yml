name: Plugin Artifacts

# Verifies the Claude Code plugin's generated artifacts are committed-and-current.
# Replaces the old cross-repo update-skills workflow — skills are now symlinks
# to the in-tree lib SKILL.md files (no copying), and the search index + hook
# bundle are regenerated locally from the monorepo (no repo cloning).

on:
  push:
    branches: [main]
    paths:
      - 'libs/**/SKILL.md'
      - 'libs/**/*.examples.ts'
      - 'libs/**/*.examples.tsx'
      - 'libs/east-claude-plugin/hooks/**'
      - 'libs/east-claude-plugin/lib/**'
      - 'libs/east-claude-plugin/mcp/**'
      - 'libs/east-claude-plugin/scripts/**'
      - 'libs/east-claude-plugin/index.config.json'
      - 'libs/east-claude-plugin/index.static.json'
      - 'libs/east/src/codegen/**'
      - 'libs/east-py/packages/east-py/east/codegen/**'
      - '.github/workflows/plugin-artifacts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'libs/**/SKILL.md'
      - 'libs/**/*.examples.ts'
      - 'libs/**/*.examples.tsx'
      - 'libs/east-claude-plugin/hooks/**'
      - 'libs/east-claude-plugin/lib/**'
      - 'libs/east-claude-plugin/mcp/**'
      - 'libs/east-claude-plugin/scripts/**'
      - 'libs/east-claude-plugin/index.config.json'
      - 'libs/east-claude-plugin/index.static.json'
      - 'libs/east/src/codegen/**'
      - 'libs/east-py/packages/east-py/east/codegen/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-diagnostics (dependency)
        working-directory: libs/east-diagnostics
        run: make build

      # The index stores every program example as its IR and both printings
      # (#654): the generator imports the packages' BUILT example modules, and
      # the python printing needs east-py.
      - name: Build east-node (example modules)
        working-directory: libs/east-node
        run: make build

      - name: Build east-py-datascience (example modules)
        run: pnpm --filter @elaraai/east-py-datascience run build

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install east-py (the python printer)
        working-directory: libs/east-py
        run: uv sync --all-packages

      - name: Regenerate search index
        working-directory: libs/east-claude-plugin
        run: make index

      - name: Regenerate hook/MCP bundle
        working-directory: libs/east-claude-plugin
        run: make build

      - name: Fail if artifacts are stale
        run: |
          if ! git diff --quiet -- libs/east-claude-plugin/index.json libs/east-claude-plugin/.build; then
            echo "::error::Plugin artifacts are out of date. Run:"
            echo "  cd libs/east-claude-plugin && make index && make build"
            echo "and commit libs/east-claude-plugin/index.json + .build/."
            git --no-pager diff --stat -- libs/east-claude-plugin/index.json libs/east-claude-plugin/.build
            exit 1
          fi
          echo "Plugin artifacts are current."
