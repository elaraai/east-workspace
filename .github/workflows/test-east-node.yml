name: Test east-node

on:
  push:
    branches: [main]
    paths:
      - "libs/east/**"
      - "libs/east-node/**"
      - ".github/workflows/test-east-node.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/east/**"
      - "libs/east-node/**"
      - ".github/workflows/test-east-node.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node packages
        working-directory: libs/east-node
        run: make build

      - name: Lint
        working-directory: libs/east-node
        run: make lint

      - name: Start test services
        run: docker compose -f docker/services/docker-compose.yml --profile services up -d --wait

      - name: Run tests
        working-directory: libs/east-node
        run: make test

      - name: Stop test services
        if: always()
        run: docker compose -f docker/services/docker-compose.yml --profile services down -v
