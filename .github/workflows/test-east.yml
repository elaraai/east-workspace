name: Test east

on:
  push:
    branches: [main]
    paths:
      - "libs/east/**"
      - ".github/workflows/test-east.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/east/**"
      - ".github/workflows/test-east.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test east (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on all OSes so the build/test steps share one shell.
        shell: bash
    env:
      # east's test script uses single-quoted globs + `&&`; pnpm runs package
      # scripts via cmd.exe on Windows by default, so force a POSIX shell.
      npm_config_script_shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build east
        run: pnpm --filter @elaraai/east run build

      # eslint is OS-independent; run it once on Linux.
      - name: Lint (Linux only)
        if: runner.os == 'Linux'
        run: pnpm --filter @elaraai/east run lint

      - name: Run tests
        run: pnpm --filter @elaraai/east run test
