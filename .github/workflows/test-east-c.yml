name: Test east-c

on:
  push:
    branches: [main]
    paths:
      - "libs/east-c/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - ".github/workflows/test-east-c.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/east-c/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - ".github/workflows/test-east-c.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-east-c:
    name: Test east-c (native)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build east (for IR export)
        run: pnpm turbo run build --filter=@elaraai/east

      - name: Export test IR from east
        run: pnpm turbo run test:export --filter=@elaraai/east
        env:
          EXPORT_TEST_IR: /tmp/east-test-ir

      - name: Build east-node (for std IR export)
        run: pnpm turbo run build --filter=@elaraai/east-node-std

      - name: Export test IR from east-node-std
        run: pnpm turbo run test:export --filter=@elaraai/east-node-std
        env:
          EXPORT_TEST_IR: /tmp/east-node-std

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Build east-c
        working-directory: libs/east-c
        run: make build

      - name: Run east-c compliance tests
        working-directory: libs/east-c
        run: make test-east-c

      - name: Start test services (for std tests)
        run: docker compose --profile services up -d --wait

      - name: Run east-c-std compliance tests
        working-directory: libs/east-c
        run: make test-east-c-std

      - name: Stop test services
        if: always()
        run: docker compose --profile services down -v

  test-east-c-wasm:
    name: Test east-c-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Install dependencies
        run: pnpm install

      - name: Build WASM
        working-directory: libs/east-c
        run: make wasm

      - name: Build and test east-c-wasm
        working-directory: libs/east-c
        run: make test-east-c-wasm
