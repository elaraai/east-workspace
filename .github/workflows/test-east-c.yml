name: Test east-c

on:
  push:
    branches: [main]
    paths:
      - "libs/east-c/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - ".github/workflows/test-east-c.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/east-c/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - ".github/workflows/test-east-c.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-east-c:
    name: Test east-c (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so every step (build, httpbin, compliance) uses
        # one shell across all three OSes.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # Export IR for both suites. The fetch suite's IR targets localhost:8085;
      # export tolerates the server being absent (it only writes IR, the run
      # below is what needs httpbin).
      - name: Export test IR (east + east-node-std)
        run: |
          pnpm --filter @elaraai/east run test:export
          pnpm --filter @elaraai/east-node-std run test:export

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y

      - name: Build east-c
        working-directory: libs/east-c
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build build -j

      # httpbin for the fetch compliance suite. go-httpbin is a drop-in httpbin
      # built from source by `go install` (Go is preinstalled on every runner),
      # so the same step works on Linux/macOS/Windows with no Docker services.
      - name: Start httpbin (go-httpbin :8085)
        run: |
          go install github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@v2.18.3
          "$(go env GOPATH)/bin/go-httpbin" -port 8085 &
          for ((i = 0; i < 30; i++)); do
            curl -sf http://localhost:8085/get >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8085/get >/dev/null

      - name: east-c compliance
        working-directory: libs/east-c
        run: ./packages/east-c/scripts/run_compliance.sh /tmp/east-test-ir build/packages/east-c/test_compliance

      - name: east-c-std compliance
        working-directory: libs/east-c
        run: ./packages/east-c/scripts/run_compliance.sh /tmp/east-node-std build/packages/east-c-std/test_std_compliance

  lint-east-c:
    name: Lint east-c (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Lint
        working-directory: libs/east-c
        run: make lint
