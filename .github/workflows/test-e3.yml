name: Test e3

on:
  push:
    branches: [main]
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-py/**"
      - ".github/workflows/test-e3.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-py/**"
      - ".github/workflows/test-e3.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # The e3 default runner is `east-py run -p east-py-std`, whose native
      # east-py build (scikit-build-core + east-c via MSVC on Windows) uses the
      # Ninja generator to avoid the multi-config VS generator's MAX_PATH issues.
      CMAKE_GENERATOR: Ninja
      # pnpm runs package scripts through this shell — bash so rm -rf / single-
      # quoted globs in package scripts behave the same on Windows.
      npm_config_script_shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        working-directory: libs/east-node
        run: make build

      - name: Build e3 packages
        working-directory: libs/e3
        run: make build

      - name: Link e3 CLI
        working-directory: libs/e3
        run: make link

      - name: Install East runners
        run: |
          pnpm --filter=@elaraai/east-node-cli exec east-node --version || true
          # e3's default task runner is `east-py run -p east-py-std`, so the runner
          # needs the CLI + core + std platform (std is pure-Python, no heavy deps).
          # io + datascience are intentionally omitted: e3's tasks never call those
          # platforms, and their optional ML/DB extras don't build everywhere. Tasks
          # that need another platform pass an explicit `runner:`.
          cd libs/east-py
          uv sync --all-packages
          uv tool install --force --editable packages/east-py-cli \
            --with-editable ./packages/east-py \
            --with-editable ./packages/east-py-std

      - name: Lint
        working-directory: libs/e3
        run: make lint

      - name: Run tests
        working-directory: libs/e3
        run: make test
