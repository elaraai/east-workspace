name: Test e3

on:
  push:
    branches: [main]
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-py/**"
      - ".github/workflows/test-e3.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-py/**"
      - ".github/workflows/test-e3.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # east-py-cli is installed below so tests that pin `runner: { runtime:
      # 'east-py', ... }` can exec it. Its scikit-build-core + east-c native
      # build (MSVC on Windows) wants Ninja over the multi-config VS generator
      # to avoid MAX_PATH issues. (e3's default runner is now east-node, but
      # the python build is still needed for the tests that opt into east-py.)
      CMAKE_GENERATOR: Ninja
      # pnpm runs package scripts through this shell — bash so rm -rf / single-
      # quoted globs in package scripts behave the same on Windows.
      npm_config_script_shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        working-directory: libs/east-node
        run: make build

      - name: Build e3 packages
        working-directory: libs/e3
        run: make build

      # The first `pnpm install` ran before any package was built, so EVERY
      # workspace bin (east-node, e3, e3-api-server, …) failed to link —
      # pnpm reads the bin target file to write the shim and the dists
      # didn't exist yet. A plain second `pnpm install` reports "Already
      # up to date" (CI defaults to --frozen-lockfile, modules state
      # already considers itself done) and DOES NOT retry the failed
      # shims. `--force` reinstalls and re-creates the bins.
      #
      # The east-py-defaulted tests previously passed on POSIX by accident
      # — east-py is installed via `uv tool install` (system PATH),
      # outside pnpm bins. Switching the e3 default to east-node exposed
      # the gap, since east-node IS a pnpm-managed workspace bin.
      - name: Recreate workspace bin shims
        run: pnpm install --force
      - name: Verify east-node is on workspace .bin
        shell: bash
        run: |
          # Fail fast with a clear message if the recreate didn't work,
          # rather than chasing fuzz failures 60 lines into a test log.
          for bin in east-node e3; do
            if [ ! -e "node_modules/.bin/$bin" ]; then
              echo "::error::Workspace bin missing after recreate: node_modules/.bin/$bin"
              ls -la node_modules/.bin/ | head -40
              exit 1
            fi
          done
          echo "✓ east-node + e3 resolved on workspace .bin"

      - name: Link e3 CLI
        working-directory: libs/e3
        run: make link

      - name: Install East runners
        run: |
          # east-node is e3's default runner — pnpm install above already
          # placed east-node on node_modules/.bin and LocalTaskRunner's
          # PATH augmentation adds it for spawned tasks. The e3 suite
          # exercises it downstream; no separate version probe needed.
          #
          # east-py-cli + core + std for tests that pin `runner: { runtime:
          # 'east-py', ... }`. io + datascience extras are intentionally
          # omitted: their optional ML/DB deps don't build everywhere, and
          # no e3 test under this matrix needs them.
          cd libs/east-py
          uv sync --all-packages
          uv tool install --force --editable packages/east-py-cli \
            --with-editable ./packages/east-py \
            --with-editable ./packages/east-py-std

      - name: Lint
        working-directory: libs/e3
        run: make lint

      - name: Run tests
        working-directory: libs/e3
        run: make test
