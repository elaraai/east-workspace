name: Test e3

on:
  push:
    branches: [main]
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-py/**"
      - ".github/workflows/test-e3.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-py/**"
      - ".github/workflows/test-e3.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # east-py-cli is installed below so tests that pin `runner: { runtime:
      # 'east-py', ... }` can exec it. Its scikit-build-core + east-c native
      # build (MSVC on Windows) wants Ninja over the multi-config VS generator
      # to avoid MAX_PATH issues. (e3's default runner is now east-node, but
      # the python build is still needed for the tests that opt into east-py.)
      CMAKE_GENERATOR: Ninja
      # pnpm runs package scripts through this shell — bash so rm -rf / single-
      # quoted globs in package scripts behave the same on Windows.
      npm_config_script_shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        working-directory: libs/east-node
        run: make build

      - name: Build e3 packages
        working-directory: libs/e3
        run: make build

      - name: Link e3 CLI
        working-directory: libs/e3
        run: make link

      - name: Install East runners
        run: |
          # east-node is e3's default runner — pnpm install above already
          # placed east-node on node_modules/.bin and LocalTaskRunner's
          # PATH augmentation adds it for spawned tasks. The e3 suite
          # exercises it downstream; no separate version probe needed.
          #
          # east-py-cli + core + std for tests that pin `runner: { runtime:
          # 'east-py', ... }`. io + datascience extras are intentionally
          # omitted: their optional ML/DB deps don't build everywhere, and
          # no e3 test under this matrix needs them.
          cd libs/east-py
          uv sync --all-packages
          uv tool install --force --editable packages/east-py-cli \
            --with-editable ./packages/east-py \
            --with-editable ./packages/east-py-std

      - name: Diagnose runner availability (debug)
        shell: bash
        run: |
          echo "=== workspace root .bin entries (east* / e3*) ==="
          ls -la node_modules/.bin/ | grep -E 'east|e3' || true
          echo
          echo "=== workspace root @elaraai dir ==="
          ls -la node_modules/@elaraai/ | grep -E 'east|e3' || true
          echo
          echo "=== east-node-std dist/src/platform.js ==="
          ls -la node_modules/@elaraai/east-node-std/dist/src/platform.js 2>&1 || true
          ls -la libs/east-node/packages/east-node-std/dist/src/platform.js 2>&1 || true
          echo
          echo "=== fuzz/.bin/east-node resolvable? ==="
          ls -la libs/e3/test/fuzz/node_modules/.bin/east-node 2>&1 || true
          echo
          echo "=== can node resolve east-node-std/platform from east-node-cli dir? ==="
          ( cd libs/east-node/packages/east-node-cli && \
            node --eval "import('@elaraai/east-node-std/platform').then(m => console.log('OK', m.default.length, 'fns')).catch(e => console.log('FAIL:', e.code, e.message))" )
          echo
          echo "=== invoke east-node version (mimics what e3 does) ==="
          libs/e3/test/fuzz/node_modules/.bin/east-node version -p @elaraai/east-node-std || echo "(non-zero exit)"

      - name: Lint
        working-directory: libs/e3
        run: make lint

      - name: Run tests
        working-directory: libs/e3
        run: make test
