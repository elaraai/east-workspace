name: Test e3

on:
  push:
    branches: [main]
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-web/**"
      - "libs/east-py/**"
      - "libs/east-c/**"
      # The East rules gate e3's lint: a rule change runs it.
      - "libs/east-diagnostics/**"
      - "libs/eslint-plugin-east/**"
      # httpbin, which e3-web's browser specs call, is started from here.
      - "docker/services/**"
      - ".github/workflows/test-e3.yml"
  # Every PR, whatever its base: a PR stacked on another PR's branch is
  # checked as one into main is.
  pull_request:
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-web/**"
      - "libs/east-py/**"
      - "libs/east-c/**"
      # The East rules gate e3's lint: a rule change runs it.
      - "libs/east-diagnostics/**"
      - "libs/eslint-plugin-east/**"
      # httpbin, which e3-web's browser specs call, is started from here.
      - "docker/services/**"
      - ".github/workflows/test-e3.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # e3-core's unit tests, the other packages' (with lint on Linux) and
        # the integration specs, each split by the times its system recorded
        # (libs/e3/Makefile, #1466). The jobs run side by side, so the longest
        # sets the wall clock: macOS's, whose runners are few, five at a time
        # for every run of every workflow. Each system runs as few jobs as
        # finish within it, since every job of every run takes one of the
        # organisation's runners: Linux and macOS four — e3-core's tests in one,
        # the other packages' in another, the integration specs in two shards —
        # and Windows, the slowest, e3-core's in two and the integration specs
        # in three.
        include:
          - { os: ubuntu-latest, shard: core, core: true }
          # The browser specs' runner is pinned: Playwright installs no browser on the Ubuntu 26.04 that ubuntu-latest is rolling on to.
          - { os: ubuntu-latest, shard: packages, runner: ubuntu-24.04 }
          - { os: ubuntu-latest, shard: integration-1, shards: 2 }
          - { os: ubuntu-latest, shard: integration-2, shards: 2 }
          - { os: windows-latest, shard: core-1 }
          - { os: windows-latest, shard: core-2 }
          - { os: windows-latest, shard: packages }
          - { os: windows-latest, shard: integration-1, shards: 3 }
          - { os: windows-latest, shard: integration-2, shards: 3 }
          - { os: windows-latest, shard: integration-3, shards: 3 }
          - { os: macos-15, shard: core, core: true }
          - { os: macos-15, shard: packages }
          - { os: macos-15, shard: integration-1, shards: 2 }
          - { os: macos-15, shard: integration-2, shards: 2 }
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # east-py-cli is installed below so tests that pin `runner: { runtime:
      # 'east-py', ... }` can exec it. Its scikit-build-core + east-c native
      # build (MSVC on Windows) wants Ninja over the multi-config VS generator
      # to avoid MAX_PATH issues. (e3's default runner is now east-node, but
      # the python build is still needed for the tests that opt into east-py.)
      CMAKE_GENERATOR: Ninja
      # pnpm runs package scripts through this shell — bash so rm -rf / single-
      # quoted globs in package scripts behave the same on Windows.
      npm_config_script_shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # Node's compile cache for every process the job starts, the e3 CLI and
      # each runner among them (#1466); and on Windows the temporary files on
      # the drive the checkout is on, D:, rather than C:.
      - name: Point Node's compile cache and the temporary files at the runner's disk
        run: |
          echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
            echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          fi

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      # setup-uv 7.6 and later fetch uv from Astral's mirror, not GitHub's
      # releases, whose downloads time out; its cache stays off, as before.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      # e3-core runs each runner on Windows through its job launcher, which a
      # published install carries as the optional dependency
      # @elaraai/e3-job-win32-x64. In this checkout it is built and staged into
      # the workspace node_modules instead (in the MSVC environment set up
      # above); e3-core's tests fail on Windows without it.
      - name: Install the job launcher (Windows)
        if: runner.os == 'Windows'
        working-directory: libs/e3
        run: make install-job

      # The libraries e3 builds on, as their sources, the lockfile and the root
      # config built them: restored where none of those changed since, so a
      # change to e3 alone builds e3 alone (#1466).
      - name: Restore the dependencies' builds
        id: deps
        uses: actions/cache@v4
        with:
          key: e3-deps-${{ runner.os }}-node22-${{ hashFiles('libs/east/**', 'libs/east-node/**', 'libs/east-web/**', 'libs/create/packages/scaffold-core/**', 'libs/east-diagnostics/**', 'libs/eslint-plugin-east/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'paths.mk', 'tsconfig*.json', '!**/node_modules/**', '!**/dist/**') }}
          path: |
            libs/east/dist
            libs/east-node/packages/*/dist
            libs/east-web/packages/*/dist
            libs/create/packages/scaffold-core/dist
            libs/east-diagnostics/dist
            libs/eslint-plugin-east/dist

      - name: Build east (dependency)
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: libs/east-node
        run: make build

      # e3-web's unit workers run East programs on east-web-std.
      - name: Build east-web (dependency)
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: libs/east-web
        run: make build

      - name: Build scaffold-core (environment e2e dependency)
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: libs/create
        run: pnpm --filter @elaraai/scaffold-core run build

      # `make lint` runs the East rules through eslint-plugin-east, which loads
      # east-diagnostics' rules from its dist.
      - name: Build east-diagnostics (dependency)
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: libs/east-diagnostics
        run: make build

      - name: Build eslint-plugin-east (dependency)
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: libs/eslint-plugin-east
        run: make build

      - name: Build e3 packages
        working-directory: libs/e3
        run: make build

      - name: Link e3 CLI
        working-directory: libs/e3
        run: make link

      # The East runners' install — east-py's tool environment, its native
      # extension built against east-c, and its shim — restored where east-py's
      # and east-c's sources, the Python and the uv that made it are those of a
      # job before (#1466): 1 to 2 minutes a job otherwise.
      - name: Where the East runners install
        id: runners
        run: |
          echo "tools=$(uv tool dir)" >> "$GITHUB_OUTPUT"
          echo "bin=$(uv tool dir --bin)" >> "$GITHUB_OUTPUT"
          # The interpreter the install takes, uv's default, as the install
          # finds it: its version, and where it is, which the install's
          # environment links to. setup-uv 7 installs uv's Pythons under the
          # runner's temporary directory, where v3 left them in uv's own, so an
          # install keyed by the version alone would link to a Python the job
          # does not have.
          python="$(uv python find)"
          echo "python=$("$python" -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"
          echo "pythonpath=$(printf '%s' "$python" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"
          echo "uv=$(uv --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore the East runners
        id: runners-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.runners.outputs.tools }}/elaraai-east-py-cli
            ${{ steps.runners.outputs.bin }}/east-py*
          key: east-runners-${{ runner.os }}${{ matrix.runner }}-py${{ steps.runners.outputs.python }}-${{ steps.runners.outputs.pythonpath }}-uv${{ steps.runners.outputs.uv }}-${{ hashFiles('libs/east-py/**', 'libs/east-c/packages/east-c/**', '!**/node_modules/**', '!**/build/**', '!**/.venv/**', '!**/__pycache__/**', '!**/dist/**') }}

      - name: Install East runners
        if: steps.runners-cache.outputs.cache-hit != 'true'
        run: |
          # east-node is e3's default runner — pnpm install above already
          # placed east-node on node_modules/.bin and LocalTaskRunner's
          # PATH augmentation adds it for spawned tasks. The e3 suite
          # exercises it downstream; no separate version probe needed.
          #
          # east-py-cli + core + std for tests that pin `runner: { runtime:
          # 'east-py', ... }`. io + datascience extras are intentionally
          # omitted: their optional ML/DB deps don't build everywhere, and
          # no e3 test under this matrix needs them. The tool's environment is
          # its own: no test reads the workspace's .venv, so none is synced.
          cd libs/east-py
          uv tool install --force --editable packages/east-py-cli \
            --with-editable ./packages/east-py \
            --with-editable ./packages/east-py-std

      # east-c is an optional runner for the integration suite: its legs
      # self-skip when the binary is absent, which left them skip-green in
      # CI forever (#405). Build it so they actually run. `install-cli`
      # also points node_modules/.bin/east-c at the built binary — in a dev
      # checkout the published launcher shim there has no per-platform
      # binary package, so server-side runner spawns would error without
      # it. Windows is left to test-east-c.yml's own matrix — the vendored
      # static-curl build is minutes of compile for legs this suite would
      # skip anyway (the specs probe the bare `east-c` name, not
      # `east-c.exe`).
      - name: Install east-c build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Install east-c build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Build east-c (integration runner)
        if: runner.os != 'Windows'
        working-directory: libs/east-c
        env:
          # The job-level CMAKE_GENERATOR=Ninja is for east-py's MSVC build;
          # the runners don't ship a bare `ninja` for this direct cmake call.
          CMAKE_GENERATOR: "Unix Makefiles"
        run: make install-cli

      # The specs this integration shard runs: its share of the split by
      # recorded time, which the next step reads.
      - name: Integration specs of this shard
        id: specs
        if: startsWith(matrix.shard, 'integration-')
        working-directory: libs/e3
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          specs="$(make --no-print-directory integration-shard-specs SHARD=${MATRIX_SHARD#integration-} SHARDS=${{ matrix.shards || 4 }})"
          echo "$specs"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

      # The environment e2e materializes an env from a scaffolded project's
      # lockfile. Left to resolve from PyPI/npm that env would contain the LAST
      # RELEASE's East runtime — the repo version always equals the published
      # one — so the suite would validate the previous release rather than this
      # tree. src/localStack.ts serves this tree's build from a local stand-in
      # registry instead; it builds on demand, but doing it here attributes a
      # native-build failure to a named step rather than an opaque skip. Only
      # the shard that runs the environment e2e needs it.
      - name: Build local @elaraai stack (environment e2e)
        if: contains(steps.specs.outputs.specs, 'environment-e2e')
        working-directory: libs/e3
        run: make e2e-stack

      # e3-core's delegated-cgroup test runs a unit in a cgroup systemd
      # delegates to the user, which a runner has only once a user manager
      # runs for it; without one the test skips, and would stay skip-green.
      - name: Start a user systemd manager (Linux)
        if: runner.os == 'Linux' && (startsWith(matrix.shard, 'core-') || matrix.core)
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemd-run --user --scope -p Delegate=yes -q -- true

      # e3-web's browser specs run in Chromium, in the package tests: the build
      # Playwright manages, which a bare headless launch finds in its cache —
      # the headless shell alone, as e3-ui-cli's install-browser installs it,
      # with the system libraries it needs on Linux. A spec that cannot launch
      # it fails rather than skips.
      - name: Install Chromium (e3-web's browser specs)
        if: matrix.shard == 'packages'
        working-directory: libs/e3/packages/e3-web
        run: pnpm exec playwright-core install --only-shell ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      # Lint reads the sources, which are the same on every OS: once, on Linux.
      - name: Lint
        if: matrix.shard == 'packages' && runner.os == 'Linux'
        working-directory: libs/e3
        run: make lint

      # e3-web's browser specs run east-node-std's exported compliance suite
      # over east-web-std in Chromium. Its Fetch tests call httpbin on :8085:
      # in Docker on Linux, as test-east-web.yml runs it, and go-httpbin off
      # Linux, where the runners have no Docker, as test-east-node.yml runs it.
      - name: Start httpbin (Linux, e3-web's browser specs)
        if: matrix.shard == 'packages' && runner.os == 'Linux'
        run: docker/services/up.sh httpbin

      - name: Use Go (go-httpbin, e3-web's browser specs)
        if: matrix.shard == 'packages' && runner.os != 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Start httpbin (go-httpbin :8085, e3-web's browser specs)
        if: matrix.shard == 'packages' && runner.os != 'Linux'
        run: |
          go install github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@v2.18.3
          "$(go env GOPATH)/bin/go-httpbin" -port 8085 &
          echo "GO_HTTPBIN_PID=$!" >> "$GITHUB_ENV"
          for ((i = 0; i < 30; i++)); do
            curl -sf http://localhost:8085/get >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8085/get >/dev/null

      # The export goes to a directory of the runner's own, which the package
      # tests are given too. It is written with forward slashes, so Node and
      # bash read it as one place: on Windows they read /tmp as two.
      - name: Export east-node-std's compliance suite (e3-web's browser specs)
        if: matrix.shard == 'packages'
        timeout-minutes: 10
        run: |
          export EAST_NODE_STD_IR="${RUNNER_TEMP//\\//}/east-node-std"
          echo "EAST_NODE_STD_IR=$EAST_NODE_STD_IR" >> "$GITHUB_ENV"
          make -C libs/east-node test-export-std

      # A hung test would otherwise hold its job to the 90-minute limit, and a
      # job's log is readable only once the job ends. Each limit sits well
      # above its step's slowest green run (Windows: ten minutes before e3-web
      # ran every API suite in Chromium, which adds minutes); e3's package
      # test scripts also time a test file out after 8 minutes, naming it.
      - name: Run package tests
        if: matrix.shard == 'packages'
        working-directory: libs/e3
        timeout-minutes: 25
        run: make test-packages-rest

      # A core shard's share, and its specs' times: the reports
      # libs/e3/test/integration's dist/spec-timings.js refreshes
      # packages/e3-core/spec.timings.json from. macOS runs them all.
      - name: Run e3-core's tests
        if: startsWith(matrix.shard, 'core-') || matrix.core
        working-directory: libs/e3
        timeout-minutes: 25
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          if [ "${MATRIX_SHARD#core-}" != "$MATRIX_SHARD" ]; then
            make test-packages-core SHARD=${MATRIX_SHARD#core-} REPORT="$RUNNER_TEMP/core-timings.json"
          else
            make test-packages-core
          fi

      - name: Upload e3-core's test times
        if: always() && startsWith(matrix.shard, 'core-')
        uses: actions/upload-artifact@v4
        with:
          name: core-timings-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/core-timings.json
          if-no-files-found: ignore
          retention-days: 14

      # A runner whose processes run as another user needs e3 to run as root,
      # so the package tests skip e3-core's spec of one. It runs here under
      # sudo, switching to the user sudo names: the runner's own, which owns
      # the checkout the runner CLIs are found in. sudo resets PATH, so the
      # job's is passed on, with its node.
      - name: Run the spec of processes run as another user, as root (POSIX)
        if: (matrix.shard == 'core-1' || matrix.core) && runner.os != 'Windows'
        working-directory: libs/e3
        timeout-minutes: 10
        run: sudo env "PATH=$PATH" make test-as-another-user

      - name: Stop httpbin (e3-web's browser specs)
        if: always() && matrix.shard == 'packages'
        run: |
          case "$RUNNER_OS" in
            Linux) docker compose -f docker/services/docker-compose.yml --profile services down -v ;;
            # Git Bash's $! is not the process's Windows id: stop it by its image
            Windows) taskkill //F //IM go-httpbin.exe ;;
            *) kill "$GO_HTTPBIN_PID" ;;
          esac

      # Its specs' times too: the reports libs/e3/test/integration's
      # dist/spec-timings.js refreshes integration.timings.json from.
      - name: Run integration tests
        if: startsWith(matrix.shard, 'integration-')
        working-directory: libs/e3
        # A shard holds about ten minutes of its specs' slowest-system times.
        timeout-minutes: 30
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        run: make test-integration-shard SHARD=${MATRIX_SHARD#integration-} SHARDS=${{ matrix.shards || 4 }} REPORT="$RUNNER_TEMP/integration-timings.json"

      - name: Upload test times
        if: always() && startsWith(matrix.shard, 'integration-')
        uses: actions/upload-artifact@v4
        with:
          name: integration-timings-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/integration-timings.json
          if-no-files-found: ignore
          retention-days: 14
