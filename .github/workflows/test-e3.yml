name: Test e3

on:
  push:
    branches: [main]
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-py/**"
      - ".github/workflows/test-e3.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/e3/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-py/**"
      - ".github/workflows/test-e3.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    # Windows is not yet a target: `make install-cli` builds east-py-datascience
    # (scikit-build-core / CMake / Cython + east-c + torch) natively, which does
    # not yet build on Windows. Add windows-latest once that native build is
    # ported. Cross-platform scaffolding is covered by test-create.yml.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        working-directory: libs/east-node
        run: make build

      - name: Build e3 packages
        working-directory: libs/e3
        run: make build

      - name: Link e3 CLI
        working-directory: libs/e3
        run: make link

      - name: Install East runners
        run: |
          pnpm --filter=@elaraai/east-node-cli exec east-node --version || true
          cd libs/east-py && make install-cli

      - name: Lint
        working-directory: libs/e3
        run: make lint

      - name: Run tests
        working-directory: libs/e3
        run: make test
