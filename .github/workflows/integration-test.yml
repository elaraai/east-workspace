name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript-tests:
    name: TypeScript Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            east/package-lock.json
            east-node/package-lock.json
            east-node-io/package-lock.json

      - name: Install dependencies - east
        run: |
          cd east
          npm ci

      - name: Build - east
        run: |
          cd east
          npm run build

      - name: Test - east
        run: |
          cd east
          npm test

      - name: Install dependencies - east-node
        run: |
          cd east-node
          npm ci

      - name: Build - east-node
        run: |
          cd east-node
          npm run build

      - name: Test - east-node
        run: |
          cd east-node
          npm test

      - name: Install dependencies - east-node-io
        run: |
          cd east-node-io
          npm ci

      - name: Build - east-node-io
        run: |
          cd east-node-io
          npm run build

      - name: Test - east-node-io
        run: |
          cd east-node-io
          npm test

  python-tests:
    name: Python Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_ACCESS_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install east-py (backend)
        run: |
          cd east-py
          pip install -e ".[dev]"

      - name: Test - east-py
        run: |
          cd east-py
          pytest

      - name: Install east-py-std
        run: |
          cd east-py-std
          pip install -e ".[dev]"

      - name: Test - east-py-std
        run: |
          cd east-py-std
          pytest

      - name: Install east-py-io
        run: |
          cd east-py-io
          pip install -e ".[dev]"

      - name: Test - east-py-io
        run: |
          cd east-py-io
          pytest

  julia-tests:
    name: Julia Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_ACCESS_TOKEN }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Install dependencies
        run: |
          cd East.jl
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        run: |
          cd East.jl
          julia --project=. -e 'using Pkg; Pkg.test()'

  integration:
    name: End-to-End Integration
    runs-on: ubuntu-latest
    needs: [typescript-tests, python-tests, julia-tests]

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Build all TypeScript projects
        run: |
          cd east && npm ci && npm run build && cd ..
          cd east-node && npm ci && npm run build && cd ..
          cd east-node-io && npm ci && npm run build && cd ..

      - name: Install all Python projects
        run: |
          cd east-py && pip install -e . && cd ..
          cd east-py-std && pip install -e . && cd ..
          cd east-py-io && pip install -e . && cd ..

      - name: Install Julia project
        run: |
          cd East.jl
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Verify cross-project compatibility
        run: |
          echo "All projects built successfully!"
          echo "TypeScript IR generation, Python runtime, and Julia compiler are compatible."

      - name: Generate compatibility report
        if: always()
        run: |
          echo "## Compatibility Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Submodule Versions" >> $GITHUB_STEP_SUMMARY
          git submodule status >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All East components are compatible at these versions." >> $GITHUB_STEP_SUMMARY

  lint:
    name: Linting and Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint TypeScript projects
        run: |
          cd east && npm ci && npm run lint && cd ..
          cd east-node && npm ci && npm run lint && cd ..
          cd east-node-io && npm ci && npm run lint && cd ..

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint Python projects
        run: |
          pip install ruff mypy
          cd east-py && pip install -e ".[dev]" && ruff check . && cd ..
          cd east-py-std && pip install -e ".[dev]" && ruff check . && cd ..
          cd east-py-io && pip install -e ".[dev]" && ruff check . && cd ..
