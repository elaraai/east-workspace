name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      api_key:
        description: API key profile (choose an anthropic- environment)
        type: environment
        required: true
      prompt:
        description: Task for Opus 5.5 (leave empty to check the selected key)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  select-key:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment.user.type == 'User' &&
       (startsWith(github.event.comment.body, '/opencode') ||
        startsWith(github.event.comment.body, '/oc')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.select.outputs.environment }}
      mode: ${{ steps.select.outputs.mode }}
      prompt: ${{ steps.select.outputs.prompt }}
    steps:
      # This job has no API key and checks access before a job can receive one.
      - name: Check access and select API key profile
        id: select
        uses: actions/github-script@v7
        env:
          DEFAULT_KEY: ${{ vars.OPENCODE_KEY_PROFILE || 'default' }}
        with:
          script: |
            const actor = context.payload.comment?.user.login ?? context.actor;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: actor,
            });
            if (!["admin", "maintain", "write"].includes(data.permission)) {
              throw new Error("OpenCode commands require write access to this repository.");
            }
            let profile = process.env.DEFAULT_KEY;
            let prompt = "";
            let mode = "agent";
            if (context.eventName === "workflow_dispatch") {
              const selected = context.payload.inputs.api_key ?? "";
              if (!selected.startsWith("anthropic-")) {
                throw new Error("Choose an anthropic- API key environment.");
              }
              profile = selected.slice("anthropic-".length);
              prompt = (context.payload.inputs.prompt ?? "").trim();
              mode = prompt ? "agent" : "check";
            } else {
              const command = context.payload.comment.body.match(/^\/(?:opencode|oc)(?:\s+([\s\S]*))?$/i);
              if (!command) throw new Error("Start the comment with /opencode or /oc.");
              const body = (command[1] ?? "").trim();
              if (body.startsWith("--key")) {
                const selector = body.match(/^--key=([a-z0-9][a-z0-9_-]{0,39})(?:\s|$)/);
                if (!selector) throw new Error("Use /opencode --key=profile task.");
                profile = selector[1];
              }
              // Leave PROMPT empty for comments: OpenCode preserves review-line
              // context and attachments when it reads the original comment.
            }
            if (!/^[a-z0-9][a-z0-9_-]{0,39}$/.test(profile)) {
              throw new Error("API key profile must be 1–40 lowercase letters, digits, hyphens or underscores.");
            }
            core.setOutput("environment", `anthropic-${profile}`);
            core.setOutput("mode", mode);
            core.setOutput("prompt", prompt);
            core.info(`Selected API key profile: ${profile}; model: claude-opus-5-5`);

  check-connection:
    needs: select-key
    if: needs.select-key.outputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.select-key.outputs.environment }}
    steps:
      - name: Check direct Anthropic access to Opus 5.5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          key = os.environ.get("ANTHROPIC_API_KEY", "")
          if not key:
              raise SystemExit("Add ANTHROPIC_API_KEY to the selected environment first.")
          request = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps({"model": "claude-opus-5-5", "max_tokens": 64,
                               "messages": [{"role": "user", "content": "Reply with OK only."}]}).encode(),
              headers={"x-api-key": key, "anthropic-version": "2023-06-01", "content-type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              print("Anthropic API request succeeded with model", result["model"])
          except urllib.error.HTTPError as error:
              with error:
                  detail = error.read().decode().replace(key, "[redacted]")
              raise SystemExit(f"Anthropic returned HTTP {error.code}: {detail}")
          PY

  agent:
    needs: select-key
    if: needs.select-key.outputs.mode == 'agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ needs.select-key.outputs.environment }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install OpenCode
        run: npm install --global opencode-ai@1.18.35

      - name: Run OpenCode with Opus 5.5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: anthropic/claude-opus-5-5
          USE_GITHUB_TOKEN: "true"
          SHARE: "false"
          MENTIONS: /opencode,/oc
          PROMPT: ${{ needs.select-key.outputs.prompt }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add ANTHROPIC_API_KEY to the selected environment first."
            exit 1
          fi
          # OpenCode's use_github_token mode expects the caller to configure git.
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          opencode github run
