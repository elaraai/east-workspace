name: Deploy east-ui-showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "libs/east-ui/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build east-ui packages
        run: pnpm --filter='@elaraai/east-ui...' --filter='@elaraai/east-ui-components...' run build

      - name: Build showcase
        run: pnpm --filter=@elaraai/east-ui-showcase run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: libs/east-ui/packages/east-ui-showcase/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
