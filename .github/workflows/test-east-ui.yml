name: Test east-ui

on:
  push:
    branches: [main]
    paths:
      - "libs/east-ui/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-web/**"
      - "libs/e3/**"
      # The East rules gate these packages' lint (#963): a rule change runs it.
      - "libs/east-diagnostics/**"
      - "libs/eslint-plugin-east/**"
      - ".github/workflows/test-east-ui.yml"
  pull_request:
    branches: [main]
    paths:
      - "libs/east-ui/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-web/**"
      - "libs/e3/**"
      - "libs/east-diagnostics/**"
      - "libs/eslint-plugin-east/**"
      - ".github/workflows/test-east-ui.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The packages' tests in the three groups libs/east-ui/Makefile names
  # (`make test-group`), side by side, so the longest sets the wall clock
  # rather than their sum: east-ui-components; east-ui and e3-ui; and the rest,
  # every package the other two don't name, which also lints.
  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [components, ir, rest]
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        working-directory: libs/east-node
        run: make build

      # e3-web, which e3 builds, runs East programs on east-web-std.
      - name: Build east-web (dependency)
        working-directory: libs/east-web
        run: make build

      - name: Build e3 (dependency)
        working-directory: libs/e3
        run: make build

      - name: Build east-py-datascience TypeScript (dependency)
        working-directory: libs/east-py/packages/east-py-datascience
        run: pnpm run build

      # `make lint` runs the East rules through eslint-plugin-east (#963),
      # which loads east-diagnostics' rules from its dist.
      - name: Build east-diagnostics (dependency)
        working-directory: libs/east-diagnostics
        run: make build

      - name: Build eslint-plugin-east (dependency)
        working-directory: libs/eslint-plugin-east
        run: make build

      - name: Build east-ui packages
        working-directory: libs/east-ui
        run: make build

      - name: Lint
        if: matrix.group == 'rest'
        working-directory: libs/east-ui
        run: make lint

      - name: Run tests
        working-directory: libs/east-ui
        env:
          # e3-ui-cli's terminal-UI integration spec: a real embedded e3 API
          # server over a repository seeded at test time (e3 is built above).
          E3_UI_INTEGRATION: "1"
        run: make test-group GROUP=${{ matrix.group }}

  # The showcase's Playwright suite (#833): every catalog page at desktop and
  # mobile, the shell, the code reference, the Plan's geometry and the load.
  # Each shard runs the same `make test-responsive` a developer runs. Shards
  # take an equal count of tests, and the slow ones (the e3 and catalog
  # pages) sit together, so eight shards spread them where four left two
  # shards with most of the suite.
  responsive:
    name: responsive (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        working-directory: libs/east-node
        run: make build

      # e3-web, which e3 builds, runs East programs on east-web-std.
      - name: Build east-web (dependency)
        working-directory: libs/east-web
        run: make build

      - name: Build e3 (dependency)
        working-directory: libs/e3
        run: make build

      - name: Build east-py-datascience TypeScript (dependency)
        working-directory: libs/east-py/packages/east-py-datascience
        run: pnpm run build

      - name: Build east-ui packages
        working-directory: libs/east-ui
        run: make build

      - name: Install Chromium
        working-directory: libs/east-ui
        run: pnpm --filter @elaraai/east-ui-showcase exec playwright install --with-deps chromium

      - name: Responsive suite
        working-directory: libs/east-ui
        run: make test-responsive SHARD=${{ matrix.shard }}/8

      # A failing spec's screenshot and trace (open the trace with
      # `pnpm exec playwright show-trace <trace.zip>`).
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-test-results-${{ matrix.shard }}
          path: libs/east-ui/packages/east-ui-showcase/test-results/
          retention-days: 14
