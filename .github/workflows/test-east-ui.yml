name: Test east-ui

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "libs/east-ui/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-web/**"
      - "libs/e3/**"
      # e3-ui-cli's query-plans spec runs its calls on east-c, built here (#1093),
      # and its query-equivalence spec on east-c and east-py, built here (#942).
      - "libs/east-c/**"
      - "libs/east-py/**"
      # The East rules gate these packages' lint (#963): a rule change runs it.
      - "libs/east-diagnostics/**"
      - "libs/eslint-plugin-east/**"
      - ".github/workflows/test-east-ui.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".nvmrc"
  pull_request:
    branches: [main]
    paths:
      - "libs/east-ui/**"
      - "libs/east/**"
      - "libs/east-node/**"
      - "libs/east-web/**"
      - "libs/e3/**"
      - "libs/east-c/**"
      - "libs/east-py/**"
      - "libs/east-diagnostics/**"
      - "libs/eslint-plugin-east/**"
      - ".github/workflows/test-east-ui.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".nvmrc"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile once. Every test job consumes this exact dependency/package build;
  # renderer and browser shards never repeat compilation.
  build:
    name: shared build
    outputs:
      responsive_count: ${{ steps.responsive.outputs.count }}
      responsive_shards: ${{ steps.responsive.outputs.shards }}
      responsive_total: ${{ steps.responsive.outputs.total }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          # PRs compare the merge result to its base parent, covering the whole
          # PR. Pushes compare to before, including a push of multiple commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build east (dependency)
        working-directory: libs/east
        run: make build

      - name: Build east-node (dependency)
        working-directory: libs/east-node
        run: make build

      # e3-web, which e3 builds, runs East programs on east-web-std.
      - name: Build east-web (dependency)
        working-directory: libs/east-web
        run: make build

      - name: Build e3 (dependency)
        working-directory: libs/e3
        run: make build

      - name: Build east-py-datascience TypeScript (dependency)
        working-directory: libs/east-py/packages/east-py-datascience
        run: pnpm run build

      # `make lint` runs the East rules through eslint-plugin-east (#963),
      # which loads east-diagnostics' rules from its dist.
      - name: Build east-diagnostics (dependency)
        working-directory: libs/east-diagnostics
        run: make build

      - name: Build eslint-plugin-east (dependency)
        working-directory: libs/eslint-plugin-east
        run: make build

      - name: Build east-ui packages
        working-directory: libs/east-ui
        run: make build

      - name: Select responsive checks
        id: responsive
        working-directory: libs/east-ui
        env:
          RESPONSIVE_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^' || github.event.before }}
        run: make select-responsive BASE="$RESPONSIVE_BASE" OUTPUT_DIR="$RUNNER_TEMP"

      - name: Package compiled workspaces
        run: |
          find libs/east libs/east-node libs/east-web libs/e3 libs/east-ui libs/east-py/packages/east-py-datascience libs/east-diagnostics libs/eslint-plugin-east \
            -type d -name node_modules -prune -o -type d -name dist -print -prune > "$RUNNER_TEMP/east-ui-build-paths"
          tar -cf "$RUNNER_TEMP/east-ui-build.tar" -T "$RUNNER_TEMP/east-ui-build-paths"

      - uses: actions/upload-artifact@v4
        with:
          name: east-ui-build
          path: |
            ${{ runner.temp }}/east-ui-build.tar
            ${{ runner.temp }}/responsive-tests.txt
            ${{ runner.temp }}/responsive-impact.json
          compression-level: 1
          retention-days: 1

  # Three package groups plus the separately sharded e3 renderer group cover
  # every package once (see libs/east-ui/Makefile). `rest` also owns lint and
  # the renderer's Node specs, and builds the CLI integration runners.
  test:
    needs: build
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [components, ir, rest]
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - uses: actions/download-artifact@v4
        with:
          name: east-ui-build
          path: ${{ runner.temp }}

      - name: Restore compiled workspaces
        run: tar -xf "$RUNNER_TEMP/east-ui-build.tar"

      # e3-ui-cli's query-plans and query-equivalence specs send their calls to
      # every stock runner on PATH: east-node, which the package holds, east-c,
      # the runner the query builder sends (#1093), and east-py (#942). Build
      # this tree's east-c as the east-c workflow does, Release, but its CLI
      # alone, and put it on PATH — in the group that runs e3-ui-cli's tests
      # only.
      - name: Install east-c build deps
        if: matrix.group == 'rest'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Build east-c (for e3-ui-cli's query plans)
        if: matrix.group == 'rest'
        working-directory: libs/east-c
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j --target east-c-cli
          echo "$PWD/build/packages/east-c-cli" >> "$GITHUB_PATH"

      # The spec skips a runner it cannot find: hold here that it will find east-c.
      - name: east-c on PATH
        if: matrix.group == 'rest'
        run: east-c version

      # This tree's east-py, built as the east-py workflow builds it, its CLI
      # alone put on PATH (not the venv's python): the query-equivalence spec
      # runs its units on it.
      - name: Install uv (for e3-ui-cli's query equivalence)
        if: matrix.group == 'rest'
        uses: astral-sh/setup-uv@v3

      - name: Build east-py (for e3-ui-cli's query equivalence)
        if: matrix.group == 'rest'
        working-directory: libs/east-py
        env:
          UV_PYTHON: "3.11"
          CMAKE_GENERATOR: Ninja
        run: |
          uv venv
          uv pip install scikit-build-core cython numpy setuptools ninja
          uv sync --all-packages --no-build-isolation \
            --reinstall-package elaraai-east-py --refresh-package elaraai-east-py
          mkdir -p "$RUNNER_TEMP/east-py-bin"
          ln -s "$PWD/.venv/bin/east-py" "$RUNNER_TEMP/east-py-bin/east-py"
          echo "$RUNNER_TEMP/east-py-bin" >> "$GITHUB_PATH"

      # The spec skips a runner it cannot find: hold here that it will find east-py.
      - name: east-py on PATH
        if: matrix.group == 'rest'
        run: east-py version

      - name: Lint
        if: matrix.group == 'rest'
        working-directory: libs/east-ui
        run: make lint

      - name: Run tests
        working-directory: libs/east-ui
        env:
          # e3-ui-cli's integration specs: the terminal UI, the query plans and
          # their equivalence, each over a real embedded e3 API server and
          # repositories seeded at test time (e3 is built above).
          E3_UI_INTEGRATION: "1"
        run: make test-group GROUP=${{ matrix.group }}

  e3-components:
    needs: build
    name: test (e3-components ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - uses: actions/download-artifact@v4
        with:
          name: east-ui-build
          path: ${{ runner.temp }}

      - name: Restore compiled workspaces
        run: tar -xf "$RUNNER_TEMP/east-ui-build.tar"

      # Node specs run once in test (rest); these four jobs cover every
      # renderer Vitest file once, with two workers per runner.
      - name: e3 renderer tests
        working-directory: libs/east-ui
        run: make test-group GROUP=e3-components SHARD=${{ matrix.shard }}/4

  responsive:
    needs: build
    if: needs.build.outputs.responsive_count != '0'
    name: responsive (${{ matrix.shard }}/${{ needs.build.outputs.responsive_total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.responsive_shards) }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - uses: actions/download-artifact@v4
        with:
          name: east-ui-build
          path: ${{ runner.temp }}

      - name: Restore compiled workspaces
        run: tar -xf "$RUNNER_TEMP/east-ui-build.tar"

      - name: Install Chromium
        working-directory: libs/east-ui
        run: pnpm --filter @elaraai/east-ui-showcase exec playwright install --with-deps chromium

      - name: Responsive suite
        working-directory: libs/east-ui
        run: make test-responsive SHARD=${{ matrix.shard }}/${{ needs.build.outputs.responsive_total }} TEST_LIST="$RUNNER_TEMP/responsive-tests.txt"

      # A failing spec's DOM/network trace (open the trace with
      # `pnpm exec playwright show-trace <trace.zip>`).
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-test-results-${{ matrix.shard }}
          path: libs/east-ui/packages/east-ui-showcase/test-results/
          retention-days: 14
