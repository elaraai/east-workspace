name: Build and Push Docker Images

on:
  push:
    # Every release tag builds images pinned to that release's npm versions.
    # (No `paths` filter — it suppressed tag builds whenever the release
    # commit didn't touch docker/**, leaving image tags behind npm releases.)
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact @elaraai package version to bake (e.g. 1.0.5). Empty = resolve from the release channel. The python images install under the pins that release''s published @elaraai/e3-core ships, whatever ref this runs on, or under none for a release from before releases shipped them.'
        required: false
        type: string
      release_type:
        description: 'Release channel (used when version is empty)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest  # Use latest stable versions from npm
          - beta    # Use beta versions from npm
      push:
        description: 'Push images to registry'
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    # The one version every image is built at: the build jobs take it from
    # here, so each builds what this job tested. Packages release in
    # lockstep, so every package an image installs is at it. `pinned` is the
    # version a tag or a dispatch names, which the images are tagged with too;
    # empty for a dispatch that names none, built at its channel's.
    outputs:
      version: ${{ steps.pin.outputs.version }}
      pinned: ${{ steps.pin.outputs.pinned }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # setup-uv 7.6 and later fetch uv from Astral's mirror, not GitHub's
      # releases, whose downloads time out; its cache stays off, as before.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      # `finalize` pushes the release tag only after every publish job has
      # succeeded, and a publish job succeeds only once its registry serves
      # what it published, the way an install reads it (#1399,
      # scripts/lib/registry-served.mjs). It did not always: v1.0.71's run
      # built `latest` 60 s after `publish-npm` finished, npm had not caught
      # up, the build failed inside the image (hidden by --quiet), and no
      # image of that release ever shipped; v1.0.95's and v1.0.96's waited
      # here five minutes for a package npm served eight and seven minutes
      # after accepting it, and no image shipped either. So resolve the one
      # version every image is built at — a tag's, a dispatch's, or, for a
      # dispatch that names none, its channel's current one — wait for EVERY
      # package the images install to be served at it (the same probe, which
      # passes at once for a tag the release pushed), and build exactly what
      # the build jobs below will build, which take the version from here.
      - name: Resolve the version every image is built at, once npm and PyPI serve it
        id: pin
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PINNED="${GITHUB_REF_NAME#v}"
          else
            PINNED="${{ inputs.version }}"
          fi
          if [[ -n "$PINNED" ]]; then
            VERSION="$PINNED"
          else
            # @elaraai/east-c-cli is the npm proxy for the lockstep version
            if [[ "${{ inputs.release_type }}" == "beta" ]]; then
              VERSION="$(npm view @elaraai/east-c-cli dist-tags.beta 2>/dev/null || true)"
            fi
            VERSION="${VERSION:-$(npm view @elaraai/east-c-cli version)}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "No version to build the images at" >&2
            exit 1
          fi
          # The npm packages install-packages.sh installs across the images,
          # plus the per-platform east-c prebuilt the launcher pulls on this
          # runner's architecture, and the PyPI packages.
          node scripts/wait-served.mjs --version "$VERSION" \
            --npm @elaraai/east @elaraai/east-node-std @elaraai/east-node-io @elaraai/east-node-cli @elaraai/east-ui \
                  @elaraai/e3 @elaraai/e3-types @elaraai/e3-core @elaraai/e3-cli @elaraai/e3-api-client @elaraai/e3-api-server \
                  @elaraai/east-c-cli @elaraai/east-c-cli-linux-x64 \
            --pypi elaraai-east-py elaraai-east-py-std elaraai-east-py-io elaraai-east-py-cli elaraai-east-py-datascience
          echo "EAST_RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "Every package at ${VERSION} (${PINNED:-the ${{ inputs.release_type || 'latest' }} channel's})"

      - name: Run tests (quick)
        run: bash docker/tests/test-docker-builds.sh

  build-east-node:
    name: Build east-node (AGPL)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/east-node
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.test.outputs.pinned }},enable=${{ needs.test.outputs.pinned != '' }}
            type=raw,value=${{ inputs.release_type || 'latest' }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push east-node
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.east-node
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_VERSION=${{ needs.test.outputs.version }}
            EAST_NODE_STD_VERSION=${{ needs.test.outputs.version }}
            EAST_NODE_IO_VERSION=${{ needs.test.outputs.version }}
            EAST_NODE_CLI_VERSION=${{ needs.test.outputs.version }}
            EAST_UI_VERSION=${{ needs.test.outputs.version }}

  build-e3:
    name: Build e3 (BSL + AGPL)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/e3
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.test.outputs.pinned }},enable=${{ needs.test.outputs.pinned != '' }}
            type=raw,value=${{ inputs.release_type || 'latest' }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push e3
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.e3
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_VERSION=${{ needs.test.outputs.version }}
            EAST_NODE_STD_VERSION=${{ needs.test.outputs.version }}
            EAST_NODE_IO_VERSION=${{ needs.test.outputs.version }}
            EAST_NODE_CLI_VERSION=${{ needs.test.outputs.version }}
            EAST_UI_VERSION=${{ needs.test.outputs.version }}
            E3_VERSION=${{ needs.test.outputs.version }}
            E3_TYPES_VERSION=${{ needs.test.outputs.version }}
            E3_CORE_VERSION=${{ needs.test.outputs.version }}
            E3_CLI_VERSION=${{ needs.test.outputs.version }}
            E3_API_CLIENT_VERSION=${{ needs.test.outputs.version }}
            E3_API_SERVER_VERSION=${{ needs.test.outputs.version }}
            EAST_C_CLI_VERSION=${{ needs.test.outputs.version }}
            EAST_PY_VERSION=${{ needs.test.outputs.version }}
            EAST_PY_CACHEBUST=${{ github.run_id }}

  build-east-py:
    name: Build east-py (BUSL, no datascience)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/east-py
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.test.outputs.pinned }},enable=${{ needs.test.outputs.pinned != '' }}
            type=raw,value=${{ inputs.release_type || 'latest' }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push east-py
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.east-py
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_PY_VERSION=${{ needs.test.outputs.version }}
            EAST_PY_CACHEBUST=${{ github.run_id }}

  build-east-py-datascience:
    name: Build east-py-datascience (BUSL, FROM east-py)
    # FROM-chained: consumes the east-py image this run just pushed.
    needs: [test, build-east-py]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/east-py-datascience
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.test.outputs.version }},enable=true
            type=raw,value=${{ inputs.release_type || 'latest' }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push east-py-datascience
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.east-py-datascience
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_PY_VERSION=${{ needs.test.outputs.version }}
            EAST_PY_CACHEBUST=${{ github.run_id }}

  build-east-c:
    name: Build east-c (BUSL)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/east-c
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.test.outputs.pinned }},enable=${{ needs.test.outputs.pinned != '' }}
            type=raw,value=${{ inputs.release_type || 'latest' }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push east-c
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.east-c
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_C_CLI_VERSION=${{ needs.test.outputs.version }}

  images-complete:
    name: Verify complete tier set
    # The release gate (elaraai/east-workspace#299): a version must never ship
    # with a partial tier set — e3-cloud keys derived artifacts by
    # (envHash, e3Version) and assumes EVERY tier base exists at that version.
    # Verifies each image resolves anonymously (also catches a ghcr package
    # accidentally left Private — a private base 401s at FROM).
    needs: [test, build-east-node, build-e3, build-east-py, build-east-py-datascience, build-east-c]
    if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect all image manifests anonymously
        run: |
          VERSION="${{ needs.test.outputs.version }}"
          echo "Verifying all five images at :${VERSION} (anonymous pulls)"
          docker logout ghcr.io 2>/dev/null || true
          FAILED=0
          for IMAGE in east-node e3 east-py east-py-datascience east-c; do
            if docker manifest inspect "ghcr.io/elaraai/${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "  OK   ghcr.io/elaraai/${IMAGE}:${VERSION}"
            else
              echo "  FAIL ghcr.io/elaraai/${IMAGE}:${VERSION} — missing, or the ghcr package is Private (anonymous pull 401s)"
              FAILED=1
            fi
          done
          exit $FAILED
