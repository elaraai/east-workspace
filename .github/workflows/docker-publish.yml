name: Build and Push Docker Images

on:
  push:
    # Every release tag builds images pinned to that release's npm versions.
    # (No `paths` filter — it suppressed tag builds whenever the release
    # commit didn't touch docker/**, leaving image tags behind npm releases.)
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact @elaraai package version to bake (e.g. 1.0.5). Empty = resolve from the release channel.'
        required: false
        type: string
      release_type:
        description: 'Release channel (used when version is empty)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest  # Use latest stable versions from npm
          - beta    # Use beta versions from npm
      push:
        description: 'Push images to registry'
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run tests (quick)
        run: bash docker/tests/test-docker-builds.sh

  build-east-node:
    name: Build east-node (AGPL)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Get package versions
        id: versions
        run: |
          CHANNEL="${{ inputs.release_type || 'latest' }}"
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

          # Packages release in lockstep: pin every package to ONE version.
          # Tag push -> the tag's version; dispatch -> explicit input;
          # otherwise resolve the channel's current version from npm.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PINNED="${GITHUB_REF_NAME#v}"
          else
            PINNED="${{ inputs.version }}"
          fi

          if [[ -n "$PINNED" ]]; then
            # Wait for npm propagation (tag push can race npm publish)
            for i in $(seq 1 30); do
              if npm view "@elaraai/east@${PINNED}" version >/dev/null 2>&1; then break; fi
              echo "Waiting for @elaraai/east@${PINNED} on npm... ($i/30)"
              sleep 10
            done
            npm view "@elaraai/east@${PINNED}" version >/dev/null
            EAST_VERSION="$PINNED"
            EAST_NODE_STD_VERSION="$PINNED"
            EAST_NODE_IO_VERSION="$PINNED"
            EAST_NODE_CLI_VERSION="$PINNED"
            EAST_UI_VERSION="$PINNED"
          elif [[ "$CHANNEL" == "beta" ]]; then
            EAST_VERSION=$(npm view @elaraai/east dist-tags.beta 2>/dev/null || npm view @elaraai/east version)
            EAST_NODE_STD_VERSION=$(npm view @elaraai/east-node-std dist-tags.beta 2>/dev/null || npm view @elaraai/east-node-std version)
            EAST_NODE_IO_VERSION=$(npm view @elaraai/east-node-io dist-tags.beta 2>/dev/null || npm view @elaraai/east-node-io version)
            EAST_NODE_CLI_VERSION=$(npm view @elaraai/east-node-cli dist-tags.beta 2>/dev/null || npm view @elaraai/east-node-cli version)
            EAST_UI_VERSION=$(npm view @elaraai/east-ui dist-tags.beta 2>/dev/null || npm view @elaraai/east-ui version)
          else
            EAST_VERSION=$(npm view @elaraai/east version)
            EAST_NODE_STD_VERSION=$(npm view @elaraai/east-node-std version)
            EAST_NODE_IO_VERSION=$(npm view @elaraai/east-node-io version)
            EAST_NODE_CLI_VERSION=$(npm view @elaraai/east-node-cli version)
            EAST_UI_VERSION=$(npm view @elaraai/east-ui version)
          fi

          echo "pinned=${PINNED}" >> $GITHUB_OUTPUT
          echo "east=${EAST_VERSION}" >> $GITHUB_OUTPUT
          echo "east_node_std=${EAST_NODE_STD_VERSION}" >> $GITHUB_OUTPUT
          echo "east_node_io=${EAST_NODE_IO_VERSION}" >> $GITHUB_OUTPUT
          echo "east_node_cli=${EAST_NODE_CLI_VERSION}" >> $GITHUB_OUTPUT
          echo "east_ui=${EAST_UI_VERSION}" >> $GITHUB_OUTPUT

          echo "Package versions (${PINNED:-$CHANNEL}):"
          echo "  @elaraai/east: ${EAST_VERSION}"
          echo "  @elaraai/east-node-std: ${EAST_NODE_STD_VERSION}"
          echo "  @elaraai/east-node-io: ${EAST_NODE_IO_VERSION}"
          echo "  @elaraai/east-node-cli: ${EAST_NODE_CLI_VERSION}"
          echo "  @elaraai/east-ui: ${EAST_UI_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/east-node
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.versions.outputs.pinned }},enable=${{ steps.versions.outputs.pinned != '' }}
            type=raw,value=${{ steps.versions.outputs.channel }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push east-node
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.east-node
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_VERSION=${{ steps.versions.outputs.east }}
            EAST_NODE_STD_VERSION=${{ steps.versions.outputs.east_node_std }}
            EAST_NODE_IO_VERSION=${{ steps.versions.outputs.east_node_io }}
            EAST_NODE_CLI_VERSION=${{ steps.versions.outputs.east_node_cli }}
            EAST_UI_VERSION=${{ steps.versions.outputs.east_ui }}

  build-e3:
    name: Build e3 (BSL + AGPL)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Get package versions
        id: versions
        run: |
          CHANNEL="${{ inputs.release_type || 'latest' }}"
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

          # Packages release in lockstep: pin every package to ONE version.
          # Tag push -> the tag's version; dispatch -> explicit input;
          # otherwise resolve the channel's current version from npm.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PINNED="${GITHUB_REF_NAME#v}"
          else
            PINNED="${{ inputs.version }}"
          fi

          if [[ -n "$PINNED" ]]; then
            # Wait for npm propagation (tag push can race npm publish)
            for i in $(seq 1 30); do
              if npm view "@elaraai/e3@${PINNED}" version >/dev/null 2>&1; then break; fi
              echo "Waiting for @elaraai/e3@${PINNED} on npm... ($i/30)"
              sleep 10
            done
            npm view "@elaraai/e3@${PINNED}" version >/dev/null
            EAST_VERSION="$PINNED"
            EAST_NODE_STD_VERSION="$PINNED"
            EAST_NODE_IO_VERSION="$PINNED"
            EAST_NODE_CLI_VERSION="$PINNED"
            EAST_UI_VERSION="$PINNED"
            E3_VERSION="$PINNED"
            E3_TYPES_VERSION="$PINNED"
            E3_CORE_VERSION="$PINNED"
            E3_CLI_VERSION="$PINNED"
            E3_API_CLIENT_VERSION="$PINNED"
            E3_API_SERVER_VERSION="$PINNED"
            # Native east-c (npm) + Python east-py (PyPI) ship in lockstep
            EAST_C_CLI_VERSION="$PINNED"
            EAST_PY_VERSION="$PINNED"
          elif [[ "$CHANNEL" == "beta" ]]; then
            # Node.js packages
            EAST_VERSION=$(npm view @elaraai/east dist-tags.beta 2>/dev/null || npm view @elaraai/east version)
            EAST_NODE_STD_VERSION=$(npm view @elaraai/east-node-std dist-tags.beta 2>/dev/null || npm view @elaraai/east-node-std version)
            EAST_NODE_IO_VERSION=$(npm view @elaraai/east-node-io dist-tags.beta 2>/dev/null || npm view @elaraai/east-node-io version)
            EAST_NODE_CLI_VERSION=$(npm view @elaraai/east-node-cli dist-tags.beta 2>/dev/null || npm view @elaraai/east-node-cli version)
            EAST_UI_VERSION=$(npm view @elaraai/east-ui dist-tags.beta 2>/dev/null || npm view @elaraai/east-ui version)
            # e3 packages
            E3_VERSION=$(npm view @elaraai/e3 dist-tags.beta 2>/dev/null || npm view @elaraai/e3 version)
            E3_TYPES_VERSION=$(npm view @elaraai/e3-types dist-tags.beta 2>/dev/null || npm view @elaraai/e3-types version)
            E3_CORE_VERSION=$(npm view @elaraai/e3-core dist-tags.beta 2>/dev/null || npm view @elaraai/e3-core version)
            E3_CLI_VERSION=$(npm view @elaraai/e3-cli dist-tags.beta 2>/dev/null || npm view @elaraai/e3-cli version)
            E3_API_CLIENT_VERSION=$(npm view @elaraai/e3-api-client dist-tags.beta 2>/dev/null || npm view @elaraai/e3-api-client version)
            E3_API_SERVER_VERSION=$(npm view @elaraai/e3-api-server dist-tags.beta 2>/dev/null || npm view @elaraai/e3-api-server version)
            # east-c on npm; east-py on PyPI is released at the same version
            EAST_C_CLI_VERSION=$(npm view @elaraai/east-c-cli dist-tags.beta 2>/dev/null || npm view @elaraai/east-c-cli version)
            EAST_PY_VERSION="$EAST_C_CLI_VERSION"
          else
            # Node.js packages
            EAST_VERSION=$(npm view @elaraai/east version)
            EAST_NODE_STD_VERSION=$(npm view @elaraai/east-node-std version)
            EAST_NODE_IO_VERSION=$(npm view @elaraai/east-node-io version)
            EAST_NODE_CLI_VERSION=$(npm view @elaraai/east-node-cli version)
            EAST_UI_VERSION=$(npm view @elaraai/east-ui version)
            # e3 packages
            E3_VERSION=$(npm view @elaraai/e3 version)
            E3_TYPES_VERSION=$(npm view @elaraai/e3-types version)
            E3_CORE_VERSION=$(npm view @elaraai/e3-core version)
            E3_CLI_VERSION=$(npm view @elaraai/e3-cli version)
            E3_API_CLIENT_VERSION=$(npm view @elaraai/e3-api-client version)
            E3_API_SERVER_VERSION=$(npm view @elaraai/e3-api-server version)
            # east-c on npm; east-py on PyPI is released at the same version
            EAST_C_CLI_VERSION=$(npm view @elaraai/east-c-cli version)
            EAST_PY_VERSION="$EAST_C_CLI_VERSION"
          fi

          # Output versions
          echo "pinned=${PINNED}" >> $GITHUB_OUTPUT
          echo "east=${EAST_VERSION}" >> $GITHUB_OUTPUT
          echo "east_node_std=${EAST_NODE_STD_VERSION}" >> $GITHUB_OUTPUT
          echo "east_node_io=${EAST_NODE_IO_VERSION}" >> $GITHUB_OUTPUT
          echo "east_node_cli=${EAST_NODE_CLI_VERSION}" >> $GITHUB_OUTPUT
          echo "east_ui=${EAST_UI_VERSION}" >> $GITHUB_OUTPUT
          echo "e3=${E3_VERSION}" >> $GITHUB_OUTPUT
          echo "e3_types=${E3_TYPES_VERSION}" >> $GITHUB_OUTPUT
          echo "e3_core=${E3_CORE_VERSION}" >> $GITHUB_OUTPUT
          echo "e3_cli=${E3_CLI_VERSION}" >> $GITHUB_OUTPUT
          echo "e3_api_client=${E3_API_CLIENT_VERSION}" >> $GITHUB_OUTPUT
          echo "e3_api_server=${E3_API_SERVER_VERSION}" >> $GITHUB_OUTPUT
          echo "east_c_cli=${EAST_C_CLI_VERSION}" >> $GITHUB_OUTPUT
          echo "east_py=${EAST_PY_VERSION}" >> $GITHUB_OUTPUT

          echo "Package versions (${CHANNEL}):"
          echo "  @elaraai/east: ${EAST_VERSION}"
          echo "  @elaraai/east-node-std: ${EAST_NODE_STD_VERSION}"
          echo "  @elaraai/east-node-io: ${EAST_NODE_IO_VERSION}"
          echo "  @elaraai/east-node-cli: ${EAST_NODE_CLI_VERSION}"
          echo "  @elaraai/east-ui: ${EAST_UI_VERSION}"
          echo "  @elaraai/e3: ${E3_VERSION}"
          echo "  @elaraai/e3-types: ${E3_TYPES_VERSION}"
          echo "  @elaraai/e3-core: ${E3_CORE_VERSION}"
          echo "  @elaraai/e3-cli: ${E3_CLI_VERSION}"
          echo "  @elaraai/e3-api-client: ${E3_API_CLIENT_VERSION}"
          echo "  @elaraai/e3-api-server: ${E3_API_SERVER_VERSION}"
          echo "  @elaraai/east-c-cli: ${EAST_C_CLI_VERSION}"
          echo "  elaraai-east-py (PyPI): ${EAST_PY_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/e3
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.versions.outputs.pinned }},enable=${{ steps.versions.outputs.pinned != '' }}
            type=raw,value=${{ steps.versions.outputs.channel }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push e3
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.e3
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_VERSION=${{ steps.versions.outputs.east }}
            EAST_NODE_STD_VERSION=${{ steps.versions.outputs.east_node_std }}
            EAST_NODE_IO_VERSION=${{ steps.versions.outputs.east_node_io }}
            EAST_NODE_CLI_VERSION=${{ steps.versions.outputs.east_node_cli }}
            EAST_UI_VERSION=${{ steps.versions.outputs.east_ui }}
            E3_VERSION=${{ steps.versions.outputs.e3 }}
            E3_TYPES_VERSION=${{ steps.versions.outputs.e3_types }}
            E3_CORE_VERSION=${{ steps.versions.outputs.e3_core }}
            E3_CLI_VERSION=${{ steps.versions.outputs.e3_cli }}
            E3_API_CLIENT_VERSION=${{ steps.versions.outputs.e3_api_client }}
            E3_API_SERVER_VERSION=${{ steps.versions.outputs.e3_api_server }}
            EAST_C_CLI_VERSION=${{ steps.versions.outputs.east_c_cli }}
            EAST_PY_VERSION=${{ steps.versions.outputs.east_py }}
            EAST_PY_CACHEBUST=${{ github.run_id }}

  build-east-py:
    name: Build east-py (BUSL, no datascience)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.versions.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Get package versions
        id: versions
        run: |
          CHANNEL="${{ inputs.release_type || 'latest' }}"
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

          # Packages release in lockstep: pin to ONE version. Tag push -> the
          # tag's version; dispatch -> explicit input; otherwise resolve the
          # channel's current version from npm. @elaraai/east-c-cli is the npm
          # proxy for the lockstep version of the PyPI east-py packages (the
          # same convention build-e3 uses).
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PINNED="${GITHUB_REF_NAME#v}"
          else
            PINNED="${{ inputs.version }}"
          fi

          if [[ -n "$PINNED" ]]; then
            # Wait for npm propagation (tag push can race npm publish)
            for i in $(seq 1 30); do
              if npm view "@elaraai/east-c-cli@${PINNED}" version >/dev/null 2>&1; then break; fi
              echo "Waiting for @elaraai/east-c-cli@${PINNED} on npm... ($i/30)"
              sleep 10
            done
            npm view "@elaraai/east-c-cli@${PINNED}" version >/dev/null
            VERSION="$PINNED"
          elif [[ "$CHANNEL" == "beta" ]]; then
            VERSION=$(npm view @elaraai/east-c-cli dist-tags.beta 2>/dev/null || npm view @elaraai/east-c-cli version)
          else
            VERSION=$(npm view @elaraai/east-c-cli version)
          fi

          echo "pinned=${PINNED}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Lockstep version: ${VERSION}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/east-py
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.versions.outputs.pinned }},enable=${{ steps.versions.outputs.pinned != '' }}
            type=raw,value=${{ steps.versions.outputs.channel }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push east-py
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.east-py
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_PY_VERSION=${{ steps.versions.outputs.version }}
            EAST_PY_CACHEBUST=${{ github.run_id }}

  build-east-py-datascience:
    name: Build east-py-datascience (BUSL, FROM east-py)
    # FROM-chained: consumes the east-py image this run just pushed.
    needs: build-east-py
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/east-py-datascience
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.build-east-py.outputs.version }},enable=true
            type=raw,value=${{ inputs.release_type || 'latest' }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push east-py-datascience
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.east-py-datascience
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_PY_VERSION=${{ needs.build-east-py.outputs.version }}
            EAST_PY_CACHEBUST=${{ github.run_id }}

  build-east-c:
    name: Build east-c (BUSL)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Get package versions
        id: versions
        run: |
          CHANNEL="${{ inputs.release_type || 'latest' }}"
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

          # Packages release in lockstep: pin to ONE version. Tag push -> the
          # tag's version; dispatch -> explicit input; otherwise resolve the
          # channel's current version from npm. @elaraai/east-c-cli is the npm
          # proxy for the lockstep version of the PyPI east-py packages (the
          # same convention build-e3 uses).
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PINNED="${GITHUB_REF_NAME#v}"
          else
            PINNED="${{ inputs.version }}"
          fi

          if [[ -n "$PINNED" ]]; then
            # Wait for npm propagation (tag push can race npm publish)
            for i in $(seq 1 30); do
              if npm view "@elaraai/east-c-cli@${PINNED}" version >/dev/null 2>&1; then break; fi
              echo "Waiting for @elaraai/east-c-cli@${PINNED} on npm... ($i/30)"
              sleep 10
            done
            npm view "@elaraai/east-c-cli@${PINNED}" version >/dev/null
            VERSION="$PINNED"
          elif [[ "$CHANNEL" == "beta" ]]; then
            VERSION=$(npm view @elaraai/east-c-cli dist-tags.beta 2>/dev/null || npm view @elaraai/east-c-cli version)
          else
            VERSION=$(npm view @elaraai/east-c-cli version)
          fi

          echo "pinned=${PINNED}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Lockstep version: ${VERSION}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/elaraai/east-c
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.versions.outputs.pinned }},enable=${{ steps.versions.outputs.pinned != '' }}
            type=raw,value=${{ steps.versions.outputs.channel }},enable=true
            type=raw,value=latest,enable=${{ inputs.release_type == 'latest' || github.ref_type == 'tag' }}
            type=sha,prefix=

      - name: Build and push east-c
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/Dockerfile.east-c
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EAST_C_CLI_VERSION=${{ steps.versions.outputs.version }}

  images-complete:
    name: Verify complete tier set
    # The release gate (elaraai/east-workspace#299): a version must never ship
    # with a partial tier set — e3-cloud keys derived artifacts by
    # (envHash, e3Version) and assumes EVERY tier base exists at that version.
    # Verifies each image resolves anonymously (also catches a ghcr package
    # accidentally left Private — a private base 401s at FROM).
    needs: [build-east-node, build-e3, build-east-py, build-east-py-datascience, build-east-c]
    if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect all image manifests anonymously
        run: |
          VERSION="${{ needs.build-east-py.outputs.version }}"
          echo "Verifying all five images at :${VERSION} (anonymous pulls)"
          docker logout ghcr.io 2>/dev/null || true
          FAILED=0
          for IMAGE in east-node e3 east-py east-py-datascience east-c; do
            if docker manifest inspect "ghcr.io/elaraai/${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "  OK   ghcr.io/elaraai/${IMAGE}:${VERSION}"
            else
              echo "  FAIL ghcr.io/elaraai/${IMAGE}:${VERSION} — missing, or the ghcr package is Private (anonymous pull 401s)"
              FAILED=1
            fi
          done
          exit $FAILED
