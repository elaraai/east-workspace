<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>decide · pattern · reference-peers</title>
<link rel="stylesheet" href="../app_design_system/styles.css">
<link rel="stylesheet" href="./spec.css">

<style>
.nav-back { display: flex; gap: 14px; align-items: baseline; padding: 12px 0px 18px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.nav-back a { color: var(--ink-4); text-decoration: none; }
.nav-back a:hover { color: var(--brand-d); }
.nav-back .sep { color: var(--rule-strong); }
.nav-back .here { color: var(--ink); font-weight: 600; }

.facet-tabs { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; }
.facet-tab { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.04em; padding: 5px 11px; border-top: 0px; border-bottom: 0px; border-left: 0px; border-image: initial; border-right: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink-3); cursor: pointer; }
.facet-tab:last-child { border-right: 0px; }
.facet-tab:hover { background: var(--paper-3); color: var(--ink); }
.facet-tab.on { background: var(--brand-d); color: rgb(255, 255, 255); }
@keyframes facet-pulse { 
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
.facet-tab.pulse:not(.on) { color: var(--warn-dd, var(--warn)); animation: 1.8s ease-in-out 0s infinite normal none running facet-pulse; }
</style>
</head>
<body>
<article id="reference-peers" class="pattern">
      <div class="pattern-head"><span class="pattern-name">Reference<span class="ns">.</span>Peers</span></div>
      <p class="pattern-blurb" style="color: var(--ink-3);">Deferred — needs a peer-distribution dataset.</p>
      <p class="pattern-blurb">What other operators decided in cases like this. Decision distribution.</p>
      <div class="frame pad-18">
        <div class="cap-eyebrow" style="margin-bottom: 8px;">Peers · last 12 months · 38 similar cases</div>
        <div style="display: flex; gap: 1px; height: 28px; border-radius: 4px; overflow: hidden;">
          <div style="flex: 28; background: var(--brand-d); display: flex; align-items: center; justify-content: center; color: white; font-family: var(--font-mono); font-size: 11px;">28 moved shifts</div>
          <div style="flex: 7; background: var(--ink-4); display: flex; align-items: center; justify-content: center; color: white; font-family: var(--font-mono); font-size: 11px;">7 hired</div>
          <div style="flex: 3; background: var(--rule-strong); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px;">3 nothing</div>
        </div>
      </div>

    </article>
</body>
</html>
