<style>
.nav-back { display: flex; gap: 14px; align-items: baseline; padding: 12px 0px 18px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.nav-back a { color: var(--ink-4); text-decoration: none; }

.nav-back .here { color: var(--ink); font-weight: 600; }
</style>

<body>
<article id="stat-rail" class="pattern">
      <div class="pattern-head">
        <span class="pattern-name">Stat<span class="ns">.</span>Rail</span>
      </div>
      <p class="pattern-blurb">Horizontal pill rail of compact metrics — for headers and filter chips.</p>
      <div class="frame pad-18 row gap-2" style="flex-wrap: wrap;">
        <span class="chip"><span class="cap-eyebrow">Uplift</span> <span class="num">$2.4M</span> <span class="num pos">↑12%</span></span>
        <span class="chip"><span class="cap-eyebrow">Runs</span> <span class="num">7</span></span>
        <span class="chip"><span class="cap-eyebrow">Fidelity</span> <span class="num">99.4%</span> <span class="num pos">↑0.2</span></span>
        <span class="chip"><span class="cap-eyebrow">SLA</span> <span class="num">2</span></span>
      </div>

    </article>
