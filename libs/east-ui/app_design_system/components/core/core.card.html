<!-- @dsCard group="Components" viewport="700x360" name="Core atoms" subtitle="Button · Chip · Status · DeltaPill · Tag · Kbd · Banner · Avatar" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { background: var(--paper); margin: 0; padding: 16px 20px; }
  .rowlbl { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-4); min-width: 74px; }
  .demo-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .demo-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Load the generated bundle if present; otherwise compile the sibling .jsx sources.
(async function () {
  function findNs() {
    const k = Object.keys(window).find(function (k) {
      try { const v = window[k]; return v && typeof v === 'object' && v.Button && v.Status && v.DeltaPill; } catch (e) { return false; }
    });
    return k ? window[k] : null;
  }
  async function tryBundle() {
    return new Promise(function (res) {
      const s = document.createElement('script');
      s.src = '..' + '/..' + '/_ds_bundle.js';
      s.onload = function () { res(findNs()); };
      s.onerror = function () { res(null); };
      document.head.appendChild(s);
    });
  }
  async function fromSource() {
    const names = ['Button', 'Chip', 'Status', 'DeltaPill', 'Tag', 'Kbd', 'Banner', 'Avatar'];
    window.__EastCore = {};
    for (const n of names) {
      let t = await (await fetch('./' + n + '.jsx')).text();
      // scope each file so top-level consts don't collide; export by name
      t = t.replace(/import React from 'react';\n/, '')
           .replace(/export function (\w+)/, 'window.__EastCore.$1 = function $1');
      const out = Babel.transform(t, { presets: [['react', { runtime: 'classic' }]] }).code;
      (new Function('React', out))(React);
    }
    return window.__EastCore;
  }
  const NS = (await tryBundle()) || (await fromSource().catch(function (e) {
    document.getElementById('root').textContent = 'Failed to load components: ' + e.message;
    throw e;
  }));
  const { Button, Chip, Status, DeltaPill, Tag, Kbd, Banner, Avatar } = NS;
  const h = React.createElement;
  const row = function (lbl) {
    const kids = Array.prototype.slice.call(arguments, 1);
    return h('div', { className: 'demo-row' }, [h('span', { className: 'rowlbl', key: 'l' }, lbl)].concat(kids.map(function (k, i) { return h(React.Fragment, { key: i }, k); })));
  };
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    row('Button',
      h(Button, { variant: 'primary' }, 'Apply'), h(Button, null, 'Discard'), h(Button, { variant: 'ghost' }, 'Edit'),
      h(Button, { variant: 'danger' }, 'Delete'), h(Button, { variant: 'commit' }, 'Commit'), h(Button, { disabled: true }, 'Apply'), h(Button, { compact: true }, 'Compact')),
    row('Chip',
      h(Chip, null, 'Region: APAC'), h(Chip, { variant: 'brand', onDismiss: function () {} }, 'Scenario B'),
      h(Chip, { variant: 'dashed' }, 'unassigned'), h(Chip, { caret: true }, 'Last 30 days'), h(Chip, { compact: true }, 'compact')),
    row('Status',
      h(Status, { level: 'ok' }, 'Committed'), h(Status, { level: 'warn' }, 'Pending'), h(Status, { level: 'error' }, 'Blocked'),
      h(Status, { level: 'live' }, 'Live'), h(Status, { level: 'ring' }, 'Not started')),
    row('DeltaPill',
      h(DeltaPill, { dir: 'up' }, '+4.2%'), h(DeltaPill, { dir: 'down' }, '−$18k'), h(DeltaPill, { dir: 'flat' }, '0'),
      h(DeltaPill, { dir: 'up', outlined: true }, '+12'), h(DeltaPill, { dir: 'down', outlined: true }, '−3')),
    row('Tag / Kbd',
      h(Tag, { k: 'horizon', v: '14 d' }), h(Tag, { k: 'scenario', v: 'B · draft' }), h(Kbd, null, '⌘K'), h(Kbd, null, '⏎')),
    row('Avatar',
      h(Avatar, { initials: 'JK' }), h(Avatar, { initials: 'MT', filled: true, size: 24 }), h(Avatar, { initials: 'A', size: 28 })),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 10 } },
      h(Banner, { kind: 'guard', title: 'Outside guardrail.' }, 'Utilisation exceeds 92% in week 3.'),
      h(Banner, { kind: 'change', title: '4 staged changes', actions: h(Button, { variant: 'primary', compact: true }, 'Apply') }, 'Review before commit.'))
  ));
})();
</script>
</body>
</html>
