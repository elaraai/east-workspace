<!-- @dsCard group="App layout" viewport="700x190" subtitle="Sticky bottom · visible only when dirty · Override / Modify / Apply" name="Commit bar" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body { margin: 0; padding: 14px 18px; background: var(--paper-2); }
.wrap { display: grid; gap: 10px; max-width: 620px; }
.bar { display: flex; align-items: center; gap: 14px; padding: 11px 18px; background: var(--brand-tint); border: 1px solid var(--brand-d); border-radius: 8px; }
.dot { width: 8px; height: 8px; background: var(--brand-d); border-radius: 50%; flex: none; }
.sum { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--brand-dd); }
.keys { font-family: var(--font-mono); font-size: 10.5px; color: var(--brand-d); }
.acts { margin-left: auto; display: flex; gap: 8px; }
.btn { font-family: var(--font-body); font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink); }
.btn.override { border-color: var(--ink-3); color: var(--ink-2); font-weight: 600; }
.btn.primary { background: var(--brand-d); border-color: var(--brand-d); color: var(--paper); font-weight: 600; }
.clean { display: flex; align-items: center; padding: 8px 18px; border: 1px dashed var(--rule-strong); border-radius: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4); }
.ann { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-4); padding: 2px 2px 0; letter-spacing: 0.04em; }
</style></head><body>
<div class="wrap">
  <div class="bar">
    <span class="dot"></span><span class="sum">4 changes pending</span><span class="keys">shift.max_consec · sla.target · +2</span>
    <span class="acts"><button class="btn override">Override</button><button class="btn">Modify</button><button class="btn primary">Apply</button></span>
  </div>
  <div class="clean">Hidden until a field becomes dirty</div>
  <div class="ann">sticky bottom · 56px · floats 16px with shadow-md · in over --dur-base, out instantly · cluster order is fixed: Override → Modify → Apply</div>
</div>
</body></html>
