<!-- @dsCard group="Colors" viewport="700x180" subtitle="Deep teal — interactive brand + the one legal tint" name="Brand" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body { background: var(--paper); margin: 0; padding: 14px 18px; }
.g { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-bottom: 10px; }
.sw { height: 30px; border-radius: 3px; border: 1px solid var(--rule); }
.row { display: flex; gap: 6px; }
.sem { flex: 1; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; font-family: var(--font-mono); }
.sem .t { height: 26px; } .sem .m { padding: 4px 6px; font-size: 9px; line-height: 1.35; }
.sem .n { color: var(--ink); font-weight: 600; display: block; } .sem .u { color: var(--ink-4); }
</style></head><body>
<div class="g">
  <div class="sw" style="background:var(--brand-50)"></div><div class="sw" style="background:var(--brand-100)"></div><div class="sw" style="background:var(--brand-200)"></div><div class="sw" style="background:var(--brand-300)"></div><div class="sw" style="background:var(--brand-400)"></div><div class="sw" style="background:var(--brand-500)"></div><div class="sw" style="background:var(--brand-600)"></div><div class="sw" style="background:var(--brand-700)"></div><div class="sw" style="background:var(--brand-800)"></div><div class="sw" style="background:var(--brand-900)"></div>
</div>
<div class="row">
  <div class="sem"><div class="t" style="background:var(--brand)"></div><div class="m"><span class="n">--brand</span><span class="u">marks, dots</span></div></div>
  <div class="sem"><div class="t" style="background:var(--brand-d)"></div><div class="m"><span class="n">--brand-d</span><span class="u">buttons, links</span></div></div>
  <div class="sem"><div class="t" style="background:var(--brand-dd)"></div><div class="m"><span class="n">--brand-dd</span><span class="u">hover</span></div></div>
  <div class="sem"><div class="t" style="background:var(--brand-tint)"></div><div class="m"><span class="n">--brand-tint</span><span class="u">selected / dirty — only legal tint</span></div></div>
</div>
</body></html>
