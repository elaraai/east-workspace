<!-- @dsCard group="Conventions" viewport="700x190" subtitle="Chrome is mono + rules; color belongs to data marks only" name="Charts" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body { background: var(--paper); margin: 0; padding: 14px 18px; }
.wrap { display: grid; grid-template-columns: 1fr 220px; gap: 18px; align-items: start; }
.tick { font-family: var(--font-mono); font-size: 9px; fill: var(--ink-4); }
.key { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); line-height: 2; }
.key .sw { display: inline-block; width: 14px; height: 3px; border-radius: 1px; margin-right: 7px; vertical-align: middle; }
.rules { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-4); letter-spacing: 0.04em; line-height: 1.7; margin-top: 8px; border-top: 1px dashed var(--rule); padding-top: 8px; }
</style></head><body>
<div class="wrap">
  <svg viewBox="0 0 380 130" style="width:100%">
    <line x1="34" y1="10" x2="34" y2="106" stroke="var(--rule)" />
    <line x1="34" y1="106" x2="372" y2="106" stroke="var(--rule)" />
    <line x1="34" y1="58" x2="372" y2="58" stroke="var(--rule)" stroke-dasharray="2 3" />
    <text x="28" y="14" text-anchor="end" class="tick">40</text>
    <text x="28" y="61" text-anchor="end" class="tick">20</text>
    <text x="28" y="109" text-anchor="end" class="tick">0</text>
    <polygon points="34,90 118,72 202,80 286,50 372,40 372,106 34,106" fill="var(--brand-tint)" />
    <polyline points="34,90 118,72 202,80 286,50 372,40" fill="none" stroke="var(--brand-d)" stroke-width="2" />
    <polyline points="34,96 118,86 202,70 286,66 372,58" fill="none" stroke="#14b8a6" stroke-width="1.5" />
    <polyline points="286,50 330,38 372,30" fill="none" stroke="var(--brand-d)" stroke-width="1.5" stroke-dasharray="3 4" />
    <text x="60" y="120" class="tick">Jul 22</text><text x="340" y="120" class="tick">Aug 05</text>
  </svg>
  <div>
    <div class="key">
      <div><span class="sw" style="background:var(--brand-d)"></span>series 1 · --brand-d</div>
      <div><span class="sw" style="background:#14b8a6"></span>series 2 · --teal-500</div>
      <div><span class="sw" style="background:var(--brand-d);height:0;border-top:2px dashed var(--brand-d)"></span>forecast · dashed</div>
    </div>
    <div class="rules">accents in fixed order: teal → purple → blue → orange · bands ≤10% wash · axes/ticks mono on --rule</div>
  </div>
</div>
</body></html>
