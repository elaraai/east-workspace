<!-- @dsCard group="Colors" viewport="700x160" subtitle="Muted valence — color on text/dots only, washes ≤8%" name="Valence" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body { background: var(--paper); margin: 0; padding: 14px 18px; }
.row { display: flex; gap: 6px; margin-bottom: 12px; }
.sem { flex: 1; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; font-family: var(--font-mono); }
.sem .t { height: 28px; } .sem .m { padding: 4px 6px; font-size: 9px; line-height: 1.35; }
.sem .n { color: var(--ink); font-weight: 600; display: block; } .sem .u { color: var(--ink-4); }
.use { display: flex; gap: 18px; align-items: center; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; }
.use .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
</style></head><body>
<div class="row">
  <div class="sem"><div class="t" style="background:var(--pos)"></div><div class="m"><span class="n">--pos</span><span class="u">good / up</span></div></div>
  <div class="sem"><div class="t" style="background:var(--neg)"></div><div class="m"><span class="n">--neg</span><span class="u">bad / down</span></div></div>
  <div class="sem"><div class="t" style="background:var(--warn)"></div><div class="m"><span class="n">--warn</span><span class="u">caution</span></div></div>
  <div class="sem"><div class="t" style="background:var(--info)"></div><div class="m"><span class="n">--info</span><span class="u">neutral note</span></div></div>
</div>
<div class="use">
  <span style="color:var(--pos)"><span class="d" style="background:var(--pos)"></span>+4.2%</span>
  <span style="color:var(--neg)"><span class="d" style="background:var(--neg)"></span>−$18k</span>
  <span style="color:var(--warn)"><span class="d" style="background:var(--warn)"></span>PENDING</span>
  <span style="color:var(--ink-4); font-weight:500; font-size:10.5px">never saturated fills · never tinted badges</span>
</div>
</body></html>
