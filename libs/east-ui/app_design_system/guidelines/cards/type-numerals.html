<!-- @dsCard group="Type" viewport="700x170" subtitle="Every numeral is mono tabular — no exceptions" name="Numerals" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body { background: var(--paper); margin: 0; padding: 14px 18px; }
.rail { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.cell { padding: 12px 16px; border-right: 1px solid var(--rule); }
.cell:last-child { border-right: 0; }
.lbl { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 6px; }
.val { font-family: var(--font-mono); font-size: 22px; font-weight: 500; color: var(--ink); line-height: 1; letter-spacing: -0.015em; font-feature-settings: "tnum" 1; }
.sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); margin-top: 6px; }
.note { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); margin-top: 10px; letter-spacing: 0.04em; }
</style></head><body>
<div class="rail">
  <div class="cell"><div class="lbl">Expected margin</div><div class="val">$4.82M</div><div class="sub" style="color:var(--pos)">▲ +$312k vs current</div></div>
  <div class="cell"><div class="lbl">Fill rate</div><div class="val">96.4%</div><div class="sub">target ≥ 95%</div></div>
  <div class="cell"><div class="lbl">Horizon</div><div class="val">14 d</div><div class="sub">Jul 22 – Aug 05</div></div>
</div>
<div class="note">data-rail cells: mono label 9.5px caps · mono value 22px · mono sub 10.5px</div>
</body></html>
