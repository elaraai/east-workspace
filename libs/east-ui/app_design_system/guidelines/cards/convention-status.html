<!-- @dsCard group="Conventions" viewport="700x180" subtitle="Status = dot + word. Tinted badges are banned." name="Status" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body { background: var(--paper); margin: 0; padding: 14px 18px; }
.half { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pane { border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
.pane.bad { border-style: dashed; opacity: 0.85; }
.vlbl { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 10px; }
.st { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
.d { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; margin-right: 8px; }
.x { text-decoration: line-through; text-decoration-color: var(--neg); }
</style></head><body>
<div class="half">
  <div class="pane">
    <div class="vlbl" style="color:var(--pos)">✓ Do — dot + word</div>
    <span class="st"><span class="d" style="background:var(--pos)"></span>Committed</span>
    <span class="st"><span class="d" style="background:var(--warn)"></span>Pending</span>
    <span class="st"><span class="d" style="background:var(--neg)"></span>Blocked</span>
    <span class="st"><span class="d" style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-4)"></span>Not started</span>
  </div>
  <div class="pane bad">
    <div class="vlbl" style="color:var(--neg)">✕ Don't — tinted badges</div>
    <span class="badge x" style="background:#d1fae5;color:#065f46">Committed</span>
    <span class="badge x" style="background:#fef3c7;color:#92400e">Pending</span>
    <span class="badge x" style="background:#fee2e2;color:#991b1b">Blocked</span>
  </div>
</div>
</body></html>
