  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4df5f845-1019-4cce-bd24-41dca707c02b\"><\/script>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>/* East — color tokens.\n * Two layers:\n *   1. Raw scales (--brand-*, --gray-*, accent hues) — NEVER use directly in components.\n *   2. Semantic aliases (--ink-*, --paper-*, --rule*, --brand, --pos/--neg/--warn/--info,\n *      --bg-*, --fg-*) — the ONLY colors components may reference.\n * Both themes resolve through the same semantic names; a component written\n * against semantics works in dark mode for free. */\n\n:root {\n  /* ===== RAW: brand deep-teal scale ===== */\n  --brand-50:  #f0fffe;\n  --brand-100: #c2fcfc;\n  --brand-200: #94f9f9;\n  --brand-300: #79f8f8;\n  --brand-400: #5ce5e5;\n  --brand-500: #488e97;\n  --brand-600: #3a7780;\n  --brand-700: #2b4b55;\n  --brand-800: #1f363d;\n  --brand-900: #111b22;\n\n  /* ===== RAW: cool green-gray neutrals ===== */\n  --gray-50:  #f8fafa;\n  --gray-100: #f1f5f5;\n  --gray-200: #e2e8e8;\n  --gray-300: #cbd5d5;\n  --gray-400: #9bb0b0;\n  --gray-500: #6b8080;\n  --gray-600: #4a5f5f;\n  --gray-700: #374848;\n  --gray-800: #253333;\n  --gray-900: #1a2626;\n\n  /* ===== RAW: chart-only accent hues (see chart conventions) ===== */\n  --teal-500:   #14b8a6;\n  --purple-500: #8b5cf6;\n  --blue-500:   #3b82f6;\n  --green-500:  #22c55e;\n  --orange-500: #f97316;\n  --red-500:    #ef4444;\n  --yellow-500: #eab308;\n\n  /* ===== SEMANTIC: ink (text) scale, darkest → lightest ===== */\n  --ink:   #111b22;   /* primary text, headings */\n  --ink-2: #2b4b55;   /* strong secondary text */\n  --ink-3: #4a5f5f;   /* secondary text, ledes */\n  --ink-4: #6b8080;   /* labels, captions, mono eyebrows */\n  --ink-5: #9bb0b0;   /* faintest annotation */\n\n  /* ===== SEMANTIC: paper (surface) scale ===== */\n  --paper:   #ffffff; /* card / component surface */\n  --paper-2: #f8fafa; /* page background, header bands */\n  --paper-3: #f1f5f5; /* wells, inactive fills */\n\n  /* ===== SEMANTIC: rules (borders are structural, never decorative) ===== */\n  --rule:        #e2e8e8;  /* 1px inside-card dividers */\n  --rule-strong: #cbd5d5;  /* page-card edges, input borders */\n\n  /* ===== SEMANTIC: brand ===== */\n  --brand:      #488e97;\n  --brand-d:    #3a7780;  /* interactive brand (buttons, links) */\n  --brand-dd:   #2b4b55;  /* hover / pressed brand */\n  --brand-l:    #94f9f9;\n  --brand-tint: #e8f6f7;  /* selected / dirty fills — the ONLY tinted bg allowed */\n\n  /* ===== SEMANTIC: valence (muted, never saturated) ===== */\n  --pos:  #2f7a5b;\n  --neg:  #b85a4a;\n  --warn: #b8862d;\n  --info: #3a7780;\n\n  /* ===== SEMANTIC: page-level ===== */\n  --bg-primary:   #ffffff;\n  --bg-secondary: var(--gray-50);\n  --bg-tertiary:  var(--gray-100);\n  --bg-inverse:   var(--brand-900);\n  --fg-primary:   var(--gray-900);\n  --fg-secondary: var(--gray-600);\n  --fg-muted:     var(--gray-500);\n  --fg-inverse:   #ffffff;\n  --border-subtle: var(--gray-200);\n  --border-strong: var(--gray-300);\n  --border-focus:  var(--brand-500);\n  --card-bg:      #ffffff;\n  --card-border:  var(--gray-200);\n  --link:         var(--brand-600);\n  --link-hover:   var(--brand-700);\n}\n\n/* ===== Dark theme — same semantic names, inverted values ===== */\n[data-theme=\"dark\"], .dark {\n  --ink:   #f1f5f5;\n  --ink-2: #cbd5d5;\n  --ink-3: #9bb0b0;\n  --ink-4: #6b8080;\n  --ink-5: #4a5f5f;\n\n  --paper:   #1a2626;\n  --paper-2: #253333;\n  --paper-3: #374848;\n\n  --rule:        #374848;\n  --rule-strong: #4a5f5f;\n\n  --brand:      #488e97;\n  --brand-d:    #5ba9b3;   /* interactive brand lifts one step in dark */\n  --brand-dd:   #79c4cd;\n  --brand-tint: #1f363d;\n\n  --pos:  #4da583;\n  --neg:  #d98a7c;\n  --warn: #d4a74f;\n  --info: #6fb3bb;\n\n  --bg-primary:   var(--gray-900);\n  --bg-secondary: var(--gray-800);\n  --bg-tertiary:  var(--gray-700);\n  --bg-inverse:   #ffffff;\n  --fg-primary:   var(--gray-100);\n  --fg-secondary: var(--gray-400);\n  --fg-muted:     var(--gray-500);\n  --fg-inverse:   var(--brand-900);\n  --border-subtle: var(--gray-700);\n  --border-strong: var(--gray-600);\n  --card-bg:      var(--gray-800);\n  --card-border:  var(--gray-700);\n  --link:         var(--brand-300);\n  --link-hover:   var(--brand-200);\n}\n<\/style>\n<style>/* East — spacing, radii, shadow, and motion tokens. */\n:root {\n  /* spacing (4px base) */\n  --sp-0: 0; --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;\n  --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px; --sp-20: 80px;\n\n  /* radii — East is square-ish: chips/badges 2-4px, buttons 6px,\n     frames 10px. Never use --r-full on anything but avatars/dots. */\n  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-2xl: 16px; --r-full: 9999px;\n\n  /* shadows — reserved for overlays (menus, dialogs). Nothing inside a\n     frame is ever shadowed; structure comes from 1px rules. */\n  --shadow-xs: 0 1px 2px rgba(17, 27, 34, 0.05);\n  --shadow-sm: 0 1px 2px rgba(17, 27, 34, 0.06), 0 1px 3px rgba(17, 27, 34, 0.08);\n  --shadow-md: 0 4px 6px -1px rgba(17, 27, 34, 0.08), 0 2px 4px -2px rgba(17, 27, 34, 0.06);\n  --shadow-lg: 0 10px 15px -3px rgba(17, 27, 34, 0.10), 0 4px 6px -4px rgba(17, 27, 34, 0.08);\n  --shadow-xl: 0 20px 25px -5px rgba(17, 27, 34, 0.12), 0 8px 10px -6px rgba(17, 27, 34, 0.10);\n  --shadow-focus: 0 0 0 3px rgba(72, 142, 151, 0.35);\n\n  /* motion — fast and matter-of-fact; no bounces */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast: 120ms; --dur-base: 200ms; --dur-slow: 360ms;\n}\n<\/style>\n<style>/* East — typography tokens.\n * Three families, three jobs:\n *   --font-brand (DM Sans)      display: page/frame titles, hero numbers\n *   --font-body  (Inter Tight)  running UI text\n *   --font-mono  (JetBrains Mono) ALL -fs-4xl: 36px; --fs-5xl: 48px; --fs-6xl: 60px;\n\n  --fw-light: 300; --fw-normal: 400; --fw-medium: 500;\n  --fw-semibold: 600; --fw-bold: 700; --fw-extra: 800;\n\n  --lh-tight: 1.25; --lh-snug: 1.375; --lh-normal: 1.5; --lh-relaxed: 1.625;\n}\n<\/style>\n<style>/* East — base semantic element styles. */\nhtml, body {\n  font-family: var(--font-body);\n  color: var(--ink);\n  background: var(--paper-2);\n  font-feature-settings: \"tnum\" 1;\n  margin: 0;\n}\n\n.h1, h1 { font-family: var(--font-brand); font-size: var(--fs-5xl); font-weight: var(--fw-bold);     line-height: var(--lh-tight); letter-spacing: -0.02em;  color: var(--ink); }\n.h2, h2 { font-family: var(--font-brand); font-size: var(--fs-4xl); font-weight: var(--fw-bold);     line-height: var(--lh-tight); letter-spacing: -0.015em; color: var(--ink); }\n.h3, h3 { font-family: var(--font-brand); font-size: var(--fs-3xl); font-weight: var(--fw-semibold); line-height: var(--lh-snug);  letter-spacing: -0.01em;  color: var(--ink); }\n.h4, h4 { font-family: var(--font-brand); font-size: var(--fs-2xl); font-weight: var(--fw-semibold); line-height: var(--lh-snug);  color: var(--ink); }\n.h5, h5 { font-family: var(--font-body);  font-size: var(--fs-xl);  font-weight: var(--fw-semibold); line-height: var(--lh-snug);  color: var(--ink); }\n.h6, h6 { font-family: var(--font-body);  font-size: var(--fs-lg);  font-weight: var(--fw-semibold); line-height: var(--lh-normal); color: var(--ink); }\n\n.p, p    { font-size: var(--fs-md); line-height: var(--lh-relaxed); color: var(--ink); }\n.lead    { font-size: var(--fs-lg); line-height: var(--lh-relaxed); color: var(--ink-3); }\n.small   { font-size: var(--fs-sm); line-height: var(--lh-normal);  color: var(--ink-3); }\n.caption { font-size: var(--fs-xs); line-height: var(--lh-normal);  color: var(--ink-4); letter-spacing: 0.02em; }\n.eyebrow { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: var(--fw-semibold); letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand-d); }\n.mono    { font-family: var(--font-mono); font-feature-settings: \"tnum\" 1; }\n.num     { font-family: var(--font-mono); font-feature-settings: \"tnum\" 1; font-weight: var(--fw-medium); }\n.code, code { font-family: var(--font-mono); font-size: 0.92em; background: var(--paper-3); padding: 1px 5px; border-radius: var(--r-sm); color: var(--ink); }\n\na       { color: var(--link); text-decoration: none; }\na:hover { color: var(--link-hover); text-decoration: underline; text-underline-offset: 2px; }\n<\/style>\n<style>/* East — color tokens.\n * Two layers:\n *   1. Raw scales (--brand-*, --gray-*, accent hues) — NEVER use directly in components.\n *   2. Semantic aliases (--ink-*, --paper-*, --rule*, --brand, --pos/--neg/--warn/--info,\n *      --bg-*, --fg-*) — the ONLY colors components may reference.\n * Both themes resolve through the same semantic names; a component written\n * against semantics works in dark mode for free. */\n\n:root {\n  /* ===== RAW: brand deep-teal scale ===== */\n  --brand-50:  #f0fffe;\n  --brand-100: #c2fcfc;\n  --brand-200: #94f9f9;\n  --brand-300: #79f8f8;\n  --brand-400: #5ce5e5;\n  --brand-500: #488e97;\n  --brand-600: #3a7780;\n  --brand-700: #2b4b55;\n  --brand-800: #1f363d;\n  --brand-900: #111b22;\n\n  /* ===== RAW: cool green-gray neutrals ===== */\n  --gray-50:  #f8fafa;\n  --gray-100: #f1f5f5;\n  --gray-200: #e2e8e8;\n  --gray-300: #cbd5d5;\n  --gray-400: #9bb0b0;\n  --gray-500: #6b8080;\n  --gray-600: #4a5f5f;\n  --gray-700: #374848;\n  --gray-800: #253333;\n  --gray-900: #1a2626;\n\n  /* ===== RAW: chart-only accent hues (see chart conventions) ===== */\n  --teal-500:   #14b8a6;\n  --purple-500: #8b5cf6;\n  --blue-500:   #3b82f6;\n  --green-500:  #22c55e;\n  --orange-500: #f97316;\n  --red-500:    #ef4444;\n  --yellow-500: #eab308;\n\n  /* ===== SEMANTIC: ink (text) scale, darkest → lightest ===== */\n  --ink:   #111b22;   /* primary text, headings */\n  --ink-2: #2b4b55;   /* strong secondary text */\n  --ink-3: #4a5f5f;   /* secondary text, ledes */\n  --ink-4: #6b8080;   /* labels, captions, mono eyebrows */\n  --ink-5: #9bb0b0;   /* faintest annotation */\n\n  /* ===== SEMANTIC: paper (surface) scale ===== */\n  --paper:   #ffffff; /* card / component surface */\n  --paper-2: #f8fafa; /* page background, header bands */\n  --paper-3: #f1f5f5; /* wells, inactive fills */\n\n  /* ===== SEMANTIC: rules (borders are structural, never decorative) ===== */\n  --rule:        #e2e8e8;  /* 1px inside-card dividers */\n  --rule-strong: #cbd5d5;  /* page-card edges, input borders */\n\n  /* ===== SEMANTIC: brand ===== */\n  --brand:      #488e97;\n  --brand-d:    #3a7780;  /* interactive brand (buttons, links) */\n  --brand-dd:   #2b4b55;  /* hover / pressed brand */\n  --brand-l:    #94f9f9;\n  --brand-tint: #e8f6f7;  /* selected / dirty fills — the ONLY tinted bg allowed */\n\n  /* ===== SEMANTIC: valence (muted, never saturated) ===== */\n  --pos:  #2f7a5b;\n  --neg:  #b85a4a;\n  --warn: #b8862d;\n  --info: #3a7780;\n\n  /* ===== SEMANTIC: page-level ===== */\n  --bg-primary:   #ffffff;\n  --bg-secondary: var(--gray-50);\n  --bg-tertiary:  var(--gray-100);\n  --bg-inverse:   var(--brand-900);\n  --fg-primary:   var(--gray-900);\n  --fg-secondary: var(--gray-600);\n  --fg-muted:     var(--gray-500);\n  --fg-inverse:   #ffffff;\n  --border-subtle: var(--gray-200);\n  --border-strong: var(--gray-300);\n  --border-focus:  var(--brand-500);\n  --card-bg:      #ffffff;\n  --card-border:  var(--gray-200);\n  --link:         var(--brand-600);\n  --link-hover:   var(--brand-700);\n}\n\n/* ===== Dark theme — same semantic names, inverted values ===== */\n[data-theme=\"dark\"], .dark {\n  --ink:   #f1f5f5;\n  --ink-2: #cbd5d5;\n  --ink-3: #9bb0b0;\n  --ink-4: #6b8080;\n  --ink-5: #4a5f5f;\n\n  --paper:   #1a2626;\n  --paper-2: #253333;\n  --paper-3: #374848;\n\n  --rule:        #374848;\n  --rule-strong: #4a5f5f;\n\n  --brand:      #488e97;\n  --brand-d:    #5ba9b3;   /* interactive brand lifts one step in dark */\n  --brand-dd:   #79c4cd;\n  --brand-tint: #1f363d;\n\n  --pos:  #4da583;\n  --neg:  #d98a7c;\n  --warn: #d4a74f;\n  --info: #6fb3bb;\n\n  --bg-primary:   var(--gray-900);\n  --bg-secondary: var(--gray-800);\n  --bg-tertiary:  var(--gray-700);\n  --bg-inverse:   #ffffff;\n  --fg-primary:   var(--gray-100);\n  --fg-secondary: var(--gray-400);\n  --fg-muted:     var(--gray-500);\n  --fg-inverse:   var(--brand-900);\n  --border-subtle: var(--gray-700);\n  --border-strong: var(--gray-600);\n  --card-bg:      var(--gray-800);\n  --card-border:  var(--gray-700);\n  --link:         var(--brand-300);\n  --link-hover:   var(--brand-200);\n}\n\n/* East — spacing, radii, shadow, and motion tokens. */\n:root {\n  /* spacing (4px base) */\n  --sp-0: 0; --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;\n  --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px; --sp-20: 80px;\n\n  /* radii — East is square-ish: chips/badges 2-4px, buttons 6px,\n     frames 10px. Never use --r-full on anything but avatars/dots. */\n  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-2xl: 16px; --r-full: 9999px;\n\n  /* shadows — reserved for overlays (menus, dialogs). Nothing inside a\n     frame is ever shadowed; structure comes from 1px rules. */\n  --shadow-xs: 0 1px 2px rgba(17, 27, 34, 0.05);\n  --shadow-sm: 0 1px 2px rgba(17, 27, 34, 0.06), 0 1px 3px rgba(17, 27, 34, 0.08);\n  --shadow-md: 0 4px 6px -1px rgba(17, 27, 34, 0.08), 0 2px 4px -2px rgba(17, 27, 34, 0.06);\n  --shadow-lg: 0 10px 15px -3px rgba(17, 27, 34, 0.10), 0 4px 6px -4px rgba(17, 27, 34, 0.08);\n  --shadow-xl: 0 20px 25px -5px rgba(17, 27, 34, 0.12), 0 8px 10px -6px rgba(17, 27, 34, 0.10);\n  --shadow-focus: 0 0 0 3px rgba(72, 142, 151, 0.35);\n\n  /* motion — fast and matter-of-fact; no bounces */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast: 120ms; --dur-base: 200ms; --dur-slow: 360ms;\n}\n\n/* East — typography tokens.\n * Three families, three jobs:\n *   --font-brand (DM Sans)      display: page/frame titles, hero numbers\n *   --font-body  (Inter Tight)  running UI text\n *   --font-mono  (JetBrains Mono) ALL numerals (tabular), labels/eyebrows,\n *                               keys, statuses, kbd — the system's \"data voice\"\n * DM Sans is a flagged substitution for the rounded geometric sans in the\n * Elara lockup. */\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7c86ff22-cd37-4acf-bb5e-9d3e2ad9e870\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4ae0c073-26fd-422d-b55c-bf8d05904f0a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"7c86ff22-cd37-4acf-bb5e-9d3e2ad9e870\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"4ae0c073-26fd-422d-b55c-bf8d05904f0a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U no:  'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n\n  --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 20px;\n  --fs-2xl: 24px; --fs-3xl: 30px; --fs-4xl: 36px; --fs-5xl: 48px; --fs-6xl: 60px;\n\n  --fw-light: 300; --fw-normal: 400; --fw-medium: 500;\n  --fw-semibold: 600; --fw-bold: 700; --fw-extra: 800;\n\n  --lh-tight: 1.25; --lh-snug: 1.375; --lh-normal: 1.5; --lh-relaxed: 1.625;\n}\n\n/* East — base semantic element styles. */\nhtml, body {\n  font-family: var(--font-body);\n  color: var(--ink);\n  background: var(--paper-2);\n  font-feature-settings: \"tnum\" 1;\n  margin: 0;\n}\n\n.h1, h1 { font-family: var(--font-brand); font-size: var(--fs-5xl); font-weight: var(--fw-bold);     line-height: var(--lh-tight); letter-spacing: -0.02em;  color: var(--ink); }\n.h2, h2 { font-family: var(--font-brand); font-size: var(--fs-4xl); font-weight: var(--fw-bold);     line-height: var(--lh-tight); letter-spacing: -0.015em; color: var(--ink); }\n.h3, h3 { font-family: var(--font-brand); font-size: var(--fs-3xl); font-weight: var(--fw-semibold); line-height: var(--lh-snug);  letter-spacing: -0.01em;  color: var(--ink); }\n.h4, h4 { font-family: var(--font-brand); font-size: var(--fs-2xl); font-weight: var(--fw-semibold); line-height: var(--lh-snug);  color: var(--ink); }\n.h5, h5 { font-family: var(--font-body);  font-size: var(--fs-xl);  font-weight: var(--fw-semibold); line-height: var(--lh-snug);  color: var(--ink); }\n.h6, h6 { font-family: var(--font-body);  font-size: var(--fs-lg);  font-weight: var(--fw-semibold); line-height: var(--lh-normal); color: var(--ink); }\n\n.p, p    { font-size: var(--fs-md); line-height: var(--lh-relaxed); color: var(--ink); }\n.lead    { font-size: var(--fs-lg); line-height: var(--lh-relaxed); color: var(--ink-3); }\n.small   { font-size: var(--fs-sm); line-height: var(--lh-normal);  color: var(--ink-3); }\n.caption { font-size: var(--fs-xs); line-height: var(--lh-normal);  color: var(--ink-4); letter-spacing: 0.02em; }\n.eyebrow { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: var(--fw-semibold); letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand-d); }\n.mono    { font-family: var(--font-mono); font-feature-settings: \"tnum\" 1; }\n.num     { font-family: var(--font-mono); font-feature-settings: \"tnum\" 1; font-weight: var(--fw-medium); }\n.code, code { font-family: var(--font-mono); font-size: 0.92em; background: var(--paper-3); padding: 1px 5px; border-radius: var(--r-sm); color: var(--ink); }\n\na       { color: var(--link); text-decoration: none; }\na:hover { color: var(--link-hover); text-decoration: underline; text-underline-offset: 2px; }\n\n<\/style>\n<script src=\"bb6beed5-a7f6-4666-93bb-82ddddc1ec9d\"><\/script>\n<style>body{margin:0;background:var(--paper-2)}a{color:var(--brand-d);text-decoration:none}a:hover{color:var(--brand-dd)}<\/style>\n<\/helmet>\n<div data-theme=\"{{ theme }}\" style=\"min-height:100vh;background:var(--paper-2);color:var(--ink);font-family:var(--font-body);font-size:13px;padding:36px 44px 64px;box-sizing:border-box\">\n  <div style=\"max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:14px\">\n      <span style=\"font-family:var(--font-brand);font-size:22px;font-weight:700;letter-spacing:-0.015em\">Flowchart<\/span>\n      <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-4)\">Pattern<\/span>\n      <span style=\"margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-4);letter-spacing:0.06em\">slice consumer · self-contained · v0.2<\/span>\n    <\/div>\n    <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);max-width:920px;margin:0\">The state-transition flowchart as a chrome-less slice consumer wrapped in a <span style=\"font-family:var(--font-mono)\">Slice.Frame<\/span>. All controls the component needs are inside its own chassis: the eyebrow carries the slice cluster (cohort pill · filter chips · find state) and the component's own view controls (LR / TD orientation, freshness); the body owns lanes, links, legend and minimap; the footer derives the narrowed count. Nothing reaches into a host app shell — mount it anywhere a slice handle exists.<\/p>\n    <div style=\"background:var(--paper);border:1px solid var(--rule-strong);border-radius:10px;overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule)\">\n        <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-4)\">Anatomy · the component<\/span>\n        <span style=\"font-family:var(--font-mono);font-size:10px;color:var(--ink-4)\">eyebrow 44px · body fills · footer 38px · orientation toggle lives in the eyebrow right zone<\/span>\n      <\/div>\n      <div style=\"padding:18px;background:var(--paper-2)\">\n        <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px\">\n          <div style=\"flex:1;min-width:300px;display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-4)\">Core · required<\/div>\n            <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px\">\n              <div><span style=\"font-weight:700\">states<\/span> <span style=\"color:var(--ink-4)\">code (+ label) → nodes<\/span><\/div>\n              <div><span style=\"font-weight:700\">links<\/span> <span style=\"color:var(--ink-4)\">from → to state refs → arrows<\/span><\/div>\n              <div><spa -mono)\">focus 1.0 · context 0.45 · faded 0.15<\/span>. Highlighting is opacity only: nothing moves, resizes or re-routes, ever. Fades run at <span style=\"font-family:var(--font-mono)\">--dur-fast<\/span>; restore is instant.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Element hover.<\/strong> Node: the node, its links and direct neighbours at focus, rest at context. Link: the link + both endpoints at focus, rest at context. Trigger diamond: every link it governs (plus queue and outcome nodes) at focus, rest faded.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Fact echo.<\/strong> Hovering a value row in a hover card or the inspector (vessel, op, grade, decision, state class) holds the card open and echoes it: links carrying that value stay at focus, everything else fades; a count chip follows the cursor (<span style=\"font-family:var(--font-mono)\">R · 7 links<\/span>). 150ms dwell before the echo fires so scanning the card doesn't strobe the canvas.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Promote, don't trap.<\/strong> Clicking an echoed value pins it as a filter chip in the eyebrow — the echo becomes slice narrowing, with the footer count updating. <span style=\"font-family:var(--font-mono)\">esc<\/span> or pointer-leave restores everything instantly. Echo state is never saved; only promoted chips persist.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"background:var(--paper);border:1px solid var(--rule-strong);border-radius:10px;overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule)\">\n        <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-4)\">Flowchart.Node · connection points<\/span>\n        <span style=\"font-family:var(--font-mono);font-size:10px;color:var(--ink-4)\">one fixed handle per side · a link joins the closest facing pair · any handle is the drag-to-connect affordance<\/span>\n      <\/div>\n      <div style=\"padding:24px 18px;background:var(--paper-2);display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap\">\n        <svg width=\"460\" height=\"230\" sc-camel-view-box=\"0 0 460 230\" style=\"display:block;flex:none\">\n          <defs><marker id=\"np-mk\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8.5\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6.5\" sc-camel-marker-height=\"6.5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--ink-2)\"><\/path><\/marker><\/defs>\n          <g fill=\"none\">\n            <path d=\"M20 98 L164 98\" style=\"stroke:var(--ink-2)\" stroke-width=\"2\" marker-end=\"url(#np-mk)\"><\/path>\n            <path d=\"M20 150 L48 150 Q56 150 56 142 L56 106 Q56 98 64 98 L164 98\" style=\"stroke:var(--ink-2)\" stroke-width=\"1.6\" marker-end=\"url(#np-mk)\"><\/path>\n            <path d=\"M230 34 L230 62\" style=\"stroke:var(--ink-2)\" stroke-width=\"1.6\" marker-end=\"url(#np-mk)\"><\/path>\n            <path d=\"M296 98 L440 98\" style=\"stroke:var(--ink-2)\" stroke-width=\"2\" marker-end=\"url(#np-mk)\"><\/path>\n            <path d=\"M296 98 L352 98 Q360 98 360 106 L360 172 Q360 180 368 180 L430 180\" style=\"stroke:var(--ink-2)\" stroke-width=\"1.6\" marker-end=\"url(#np-mk)\"><\/path>\n            <path d=\"M230 134 L230 166\" style=\"stroke:var(--ink-2)\" stroke-width=\"1.6\" marker-end=\"url(#np-mk)\"><\/path>\n          <\/g>\n          <rect x=\"164\" y=\"62\" width=\"132\" height=\"72\" rx=\"6\" style=\"fill:var(--paper);stroke:var(--rule-strong)\" stroke-width=\"1.5\"><\/rect>\n          <text x=\"180\" y=\"92\" font-family=\"var(--font-mono)\" font-size=\"14\" font-weight=\"700\" style=\"fill:var(--ink)\">RCT<\/text>\n          <text x=\"180\" y=\"110\" font-family=\"var(--font-body)\" font-size=\"11.5\" style=\"fill:var(--ink-3)\">Reacting<\/text>\n          <g>\n            <circle cx=\"164\" cy=\"98\" r=\"4.5\" style=\"fill:var(--paper);stroke:var(--brand-d);stroke-width:1.6\"><\/circle>\n            <circle cx=\"230\" cy=\"62\" r=\"4.5\" style=\"fill:var(--paper);stroke:var(--brand-d);stroke-width:1.6\"><\/circle>\n            <circle cx=\"296\" cy=\"98\" r=\"4.5\" style=\"fill:var(--paper);stroke:var(--brand-d);stroke-width:1.6\"><\/circle>\n            <circle cx=\"230\" cy=\"134\" r=\"4.5\" style=\"fill:var(--paper);stroke:var(--brand-d);stroke-width:1.6\"><\/circle>\n          <\/g>\n          <g font-family=\"var(--font-mono)\" font-size=\"9\" font-weight=\"600\" letter-spacing=\"1.4\" style=\"fill:var(--ink-4)\">\n            <text x=\"112\" y=\"78\" text-anchor=\"middle\">LEFT<\/text>\n            <text x=\"230\" y=\"24\" text-anchor=\"middle\">TOP<\/text>\n            <text x=\"356\" y=\"78\" text-anchor=\"middle\">RIGHT<\/text>\n            <text x=\"230\" y=\"188\" text-anchor=\"middle\">BOTTOM<\/text>\n          <\/g>\n        <\/svg>\n        <div style=\"flex:1;min-width:260px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-4)\">Spec notes<\/div>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">One handle per side, fixed.<\/strong> Centre of each edge; handles are direction-agnostic. A link joins the CLOSEST FACING pair of handles on its two nodes — the router picks the nearest pair and routes H/V between them. TD orientation swaps the axes. The router never attaches a link mid-edge or at an arbitrary point.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Links converge at the handle.<\/strong> Multiple links on one side share it — each takes its own vertical channel (staggered to minimise crossings) and merges on the final run in. Past ~5 links a side, parallel links bundle into one arc with a count badge.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">The handle is the edit affordance.<\/strong> Idle nodes hide handles; hover/selection reveals all four — drag from any handle to another node to author a link. Self-loops never use handles; they stay the <span style=\"font-family:var(--font-mono)\">↻ n<\/span> badge on the node.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Connector anatomy.<\/strong> 7px ring (<span style=\"font-family:var(--font-mono)\">r 3.5<\/span>), paper fill, 1.4px stroke; 9px when the node is hovered or selected. Ring colour inherits the attached link class — brand if any attached link is selected, info if only observed links attach, otherwise ink. Hit target 16×16. Z-order: above the node border, below badges and hover cards. Handles never shift position as links attach — fan-in happens in the link channels, not on the node.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"background:var(--paper);border:1px solid var(--rule-strong);border-radius:10px;overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule)\">\n        <span style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-4)\">Flowchart.Link · geometry<\/span>\n        <span style=\"font-family:var(--font-mono);font-size:10px;color:var(--ink-4)\">H/V segments only · r 8 corners · min 12px straight at every handle, corner and arrowhead<\/span>\n      <\/div>\n      <div style=\"padding:24px 18px;background:var(--paper-2);display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap\">\n        <svg width=\"560\" height=\"210\" sc-camel-view-box=\"0 0 560 210\" style=\"display:block;flex:none\">\n          <defs><marker id=\"lk-mk\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8.5\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6.5\" sc-camel-marker-height=\"6.5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" style=\"fill:var(--ink-2)\"><\/path><\/marker><\/defs>\n          <path d=\"M36 60 L88 60 Q96 60 96 68 L96 128 Q96 136 104 136 L500 136\" fill=\"none\" style=\"stroke:var(--ink-2)\" stroke-width=\"2\" marker-end=\"url(#lk-mk)\"><\/path>\n          <circle cx=\"36\" cy=\"60\" r=\"4.5\" style=\"fill:var(--paper);stroke:var(--ink-3);stroke-width:1.4\"><\/circle>\n          <circle cx=\"508\" cy=\"136\" r=\"4.5\" style=\"fill:var(--paper);stroke:var(--ink-3);stroke-width:1.4\"><\/circle>\n          <g fill=\"none\" style=\"stroke:var(--ink-5)\" stroke-width=\"0.8\">\n            <path d=\"M40 44 L40 50 M84 44 L84 50 M40 47 L84 47\"><\/path>\n            <path d=\"M112 68 L118 68 M112 128 L118 128 M115 68 L115 128\"><\/path>\n            <path d=\"M448 120 L448 114 M496 120 L496 114 M448 117 L496 117\"><\/path>\n          <\/g>\n          <g font-family=\"var(--font-mono)\" font-size=\"9\" font-weight=\"600\" letter-spacing=\"1\" style=\"fill:var(--ink-4)\">\n            <text x=\"62\" y=\"36\" text-anchor=\"middle\">STUB ≥ 12<\/text>\n            <text x=\"128\" y=\"101\">RUN ≥ 12 BETWEEN CORNERS<\/text>\n            <text x=\"472\" y=\"108\" text-anchor=\"middle\">ENTRY ≥ 12<\/text>\n            <text x=\"36\" y=\"84\" text-anchor=\"middle\" style=\"fill:var(--ink-5)\">handle<\/text>\n            <text x=\"508\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--ink-5)\">handle<\/text>\n            <text x=\"96\" y=\"52\" text-anchor=\"start\" style=\"fill:var(--ink-5)\">r 8<\/text>\n          <\/g>\n          <g font-family=\"var(--font-mono)\" font-size=\"9.5\" font-weight=\"600\" letter-spacing=\"1.2\" style=\"fill:var(--ink-4)\">\n            <text x=\"36\" y=\"196\">LINE TYPES<\/text>\n          <\/g>\n          <g fill=\"none\">\n            <line x1=\"140\" y1=\"182\" x2=\"188\" y2=\"182\" style=\"stroke:var(--ink-2)\" stroke-width=\"2\"><\/line>\n            <line x1=\"140\" y1=\"200\" x2=\"188\" y2=\"200\" style=\"stroke:var(--info)\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"><\/line>\n            <line x1=\"330\" y1=\"182\" x2=\"378\" y2=\"182\" style=\"stroke:var(--brand-d)\" stroke-width=\"3\"><\/line>\n            <line x1=\"330\" y1=\"182\" x2=\"378\" y2=\"182\" style=\"stroke:var(--brand);opacity:0.16\" stroke-width=\"9\"><\/line>\n            <line x1=\"330\" y1=\"200\" x2=\"378\" y2=\"200\" style=\"stroke:var(--neg)\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\"><\/line>\n          <\/g>\n          <g font-family=\"var(--font-mono)\" font-size=\"9\" style=\"fill:var(--ink-3)\">\n            <text x=\"196\" y=\"185\">planned · solid<\/text>\n            <text x=\"196\" y=\"203\">observed · dashed 5/4<\/text>\n            <text x=\"386\" y=\"185\">selected · brand + halo<\/text>\n            <text x=\"386\" y=\"203\">unresolved · dashed 4/4 neg<\/text>\n          <\/g>\n        <\/svg>\n        <div style=\"flex:1;min-width:280px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-4)\">Rules<\/div>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Segments.<\/strong> Horizontal and vertical only — never diagonal, never bezier. Corners are quarter-arcs, <span style=\"font-family:var(--font-mono)\">r 8<\/span>; in tight channels r may shrink to <span style=\"font-family:var(--font-mono)\">4<\/span>, never to a sharp corner.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Minimum straights.<\/strong> ≥ 12px leaving a handle before the first corner · ≥ 12px between consecutive corners · ≥ 12px straight entry before the arrowhead. A link that cannot honour these re-routes through the next channel; it never cheats the radius.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Channels.<\/strong> Parallel runs sit ≥ 16px apart. Links sharing a target handle merge only on the final entry run. Crossings at 90° only; dashed renders over solid; a link never passes under a node.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Weight &amp; heads.<\/strong> Stroke scales with evidence volume — <span style=\"font-family:var(--font-mono)\">1.6 / 2 / 2.5<\/span>px (log scale), floor 1.4. Arrowheads are filled, a fixed 12px (never stroke-scaled), inherit the line colour, and always terminate on a handle.<\/p>\n          <p style=\"font-family:var(--font-body);font-size:12px;line-height:1.6;color:var(--ink-3);margin:0\"><strong style=\"color:var(--ink-2)\">Ornaments.<\/strong> The decision diamond (max one per link) and volume badges anchor to the midpoint of the longest straight run, never within 12px of a corner. Badges are paper-filled so they lift off crossings.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;darkMode&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Theme&quot;}, &quot;decisionLens&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Canvas&quot;}, &quot;showCandidates&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Canvas&quot;}}\">\nclass Component extends DCLogic {\n  state = { lens: false };\n  renderVals() {\n    const dark = this.props.darkMode ?? false;\n    const lens = this.state.lens || (this.props.decisionLens ?? false);\n    const showCand = this.props.showCandidates ?? true;\n    const R = 10;\n    const V = (x, y1, y2) => `M${x} ${y1} L${x} ${y2}`;\n    const O = (sx, sy, mx, ty, tx) => {\n      if (sy === ty) return `M${sx} ${sy} L${tx} ${ty}`;\n      const d1 = Math.sign(mx - sx) || 1, d2 = Math.sign(ty - sy), d3 = Math.sign(tx - mx) || d1;\n      const r = Math.max(2, Math.min(R, Math.abs(mx - sx), Math.abs(ty - sy) / 2, Math.abs(tx - mx)));\n      return `M${sx} ${sy} L${mx - d1 * r} ${sy} Q${mx} ${sy} ${mx} ${sy + d2 * r} L${mx} ${ty - d2 * r} Q${mx} ${ty} ${mx + d3 * r} ${ty} L${tx} ${ty}`;\n    };\n    const S = { c: { stroke: 'var(--ink-2)' }, b: { stroke: 'var(--ink-3)' }, w: { stroke: 'var(--warn)' }, n: { stroke: 'var(--neg)' }, i: { stroke: 'var(--info)' }, sel: { stroke: 'var(--brand-d)' }, halo: { stroke: 'var(--brand)', opacity: 0.16 } };\n    const MK = { c: 'url(#mk-ink)', b: 'url(#mk-hollow)', w: 'url(#mk-warn)', n: 'url(#mk-neg)', i: 'url(#mk-info)', s: 'url(#mk-brand)' };\n    // one fixed handle per node side: L/R at cy, T/B at cx — every link starts and ends on a handle\n    const eNat = [\n      { d: V(92, 160, 300), st: S.c, w: 2, mk: MK.c },\n      { d: O(150, 140, 183, 140, 217), st: S.c, w: 1.6, mk: MK.c },\n      { d: O(150, 320, 183, 140, 217), st: S.c, w: 2.5, mk: MK.c },\n      { d: V(275, 160, 280), st: S.c, w: 2, mk: MK.c },\n      { d: V(275, 320, 440), st: S.c, w: 2, mk: MK.c },\n      { d: 'M275 160 L275 172 Q275 180 267 180 L204 180 Q196 180 196 188 L196 452 Q196 460 204 460 L217 460', st: S.c, w: 1.6, mk: MK.c },\n      { d: V(458, 260, 400), st: S.c, w: 2.5, mk: MK.c },\n      { d: V(641, 160, 300), st: S.c, w: 2, mk: MK.c },\n      { d: O(583, 500, 560, 140, 583), st: S.c, w: 1.6, mk: MK.c },\n      { d: V(824, 340, 480), st: S.c, w: 2, mk: MK.c },\n      { d: O(882, 160, 906, 500, 882), st: S.c, w: 1.6, mk: MK.c },\n      { d: O(882, 500, 926, 320, 949), st: S.c, w: 2.5, mk: MK.c },\n      { d: O(333, 460, 524, 140, 583), st: S.i, w: 1.6, dash: '5 4', mk: MK.i },\n      { d: V(1007, 340, 540), st: S.n, w: 1.4, dash: '4 4', mk: MK.n }\n    ];\n    const eDec = [\n      { d: O(333, 140, 372, 240, 400), st: S.halo, w: 9 },\n      { d: O(333, 140, 372, 240, 400), st: S.sel, w: 3, mk: MK.s },\n      { d: O(333, 460, 356, 240, 400), st: S.c, w: 1.6, mk: MK.c },\n      { d: O(516, 420, 544, 140, 583), st: S.c, w: 2, mk: MK.c },\n      { d: V(641, 340, 480), st: S.c, w: 1.8, mk: MK.c },\n      { d: O(699, 320, 728, 160, 766), st: S.c, w: 1.6, mk: MK.c },\n      { d: O(699, 320, 736, 320, 766), st: S.c, w: 2, mk: MK.c }\n    ];\n    const eCand = [{ d: O(699, 140, 744, 500, 766), st: S.i, w: 1.6, dash: '5 4', mk: MK.i }];\n    const ports = [];\n    const seen = {};\n    [...eNat, ...eDec, ...eCand].forEach(e => {\n      if (!e.mk) return;\n      const s = e.d.match(/^M([\\d.-]+) ([\\d.-]+)/);\n      const t = e.d.match(/L([\\d.-]+) ([\\d.-]+)$/);\n      [[s[1], s[2]], [t[1], t[2]]].forEach(([x, y]) => {\n        const k = x + ',' + y;\n        if (seen[k]) return;\n        seen[k] = 1;\n        ports.push({ x: +x, y: +y, st: { fill: 'var(--paper)', stroke: e.st.stroke } });\n      });\n    });\n    return {\n      eNat, eDec, eCand, ports,\n      theme: dark ? 'dark' : 'light',\n      decisionLens: lens,\n      toggleLens: () => this.setState(s => ({ lens: !s.lens })),\n      natOp: lens ? 0.15 : 1,\n      candDisplay: showCand ? '' : 'none'\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
