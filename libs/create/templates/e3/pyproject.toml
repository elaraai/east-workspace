[project]
name = "__PROJECT_NAME__"
description = "__DISPLAY_NAME__"
requires-python = ">=3.11"
version = "0.1.0"
dependencies = [
  "elaraai-east-py",
  "elaraai-east-py-std",
  "elaraai-east-py-io",
  "elaraai-east-py-datascience",
  "elaraai-east-py-cli",
  "pytest",
  "pytest-subtests",
]

# East diagnostics (`east-py lint` / `check`, the flake8 and pylsp plugins, and
# `east-py lsp`) read this section. `check = true` lets an EDITOR run the build
# tier, which type-checks your East functions by BUILDING them — it imports the
# module, so it is off unless a project asks. Set it to false if you would
# rather run `east-py check` yourself.
[tool.east-py]
check = true
