[project]
name = "elaraai-east-py"
version = "1.0.49"
description = "Python runtime for the East programming language"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSL-1.1" }
authors = [
    {name = "East Contributors", email = "east@example.com"}
]
keywords = ["east", "embedded", "language", "runtime", "interpreter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
]

dependencies = [
    "sortedcontainers>=2.4.0",
    "typing-extensions>=4.12.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "pydocstyle>=6.3.0",
    "bandit[toml]>=1.7.9",
]
data = [
    "pandas>=2.0.0",
]
cython = [
    "cython>=3.0.0",
    "setuptools>=69.0.0",
]

[project.urls]
Homepage = "https://github.com/elaraai/east-py"
Documentation = "https://github.com/elaraai/east-py/tree/main/packages/east-py"
Repository = "https://github.com/elaraai/east-py"
Issues = "https://github.com/elaraai/east-py/issues"

[build-system]
requires = ["scikit-build-core>=0.10", "cython>=3.0.0", "numpy>=1.26.0"]
build-backend = "scikit_build_core.build"

# scikit-build-core drives the build via the CMakeLists.txt at this
# package's root. Native code (Cython + east-c link) lives there; this
# section only configures packaging-side concerns.
[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["east"]
# Built once by `uv sync` (which installs the build toolchain for that step,
# then prunes it to keep the runtime venv lean), so the extension is NOT
# rebuilt at import time — that would re-run cmake/ninja after the toolchain is
# gone, against a dead CMAKE_MAKE_PROGRAM path. Re-run `make reinstall-east-py`
# (or `make build-cython`) to pick up native source edits.
# build-dir keeps the cmake build tree in-tree so reinstalls stay incremental.
editable.rebuild = false
editable.verbose = false
build-dir = "build/{wheel_tag}"

# Include .pxd files in the wheel + sdist so downstream packages
# (east-py-std, east-py-datascience) can `cimport east._eastc` etc.
# _vendor/ holds east-c source staged by scripts/vendor-native.py so the
# sdist builds without the monorepo (PyPI install / cibuildwheel container).
sdist.include = ["east/**/*.pxd", "east/**/*.pyx", "east/py.typed", "_vendor/**"]
wheel.exclude = ["east/**/*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --cov=east --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = false  # East is dynamically typed
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
check_untyped_defs = true
# Disable checks that don't apply well to dynamically-typed East values
disable_error_code = [
    "no-any-return",
    "has-type",
    "override",
    "attr-defined",  # EastType is dynamically typed
    "arg-type",      # Runtime type flexibility
    "typeddict-item", # Dynamic dict construction
    "assignment",    # Test flexibility
    "no-redef",      # Test class patterns
    "call-overload", # TypedDict discriminated unions (can't narrow by discriminator)
    "index",         # TypedDict discriminated unions (can't narrow by discriminator)
    "union-attr",    # TypedDict discriminated unions (can't narrow by discriminator)
]

[[tool.mypy.overrides]]
module = ["sortedcontainers", "sortedcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# torch is an optional interop target (EastVector/EastMatrix to_torch/from_torch),
# not a core dependency; it may be absent in a clean typecheck environment.
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "east.types._values_cy",
    "east.serialization._binary_utils_cy",
    "east.serialization._csv_cy",
    "east.utils._ordering_cy",
    "east._eastc_bridge",
    "east._platform_bridge",
    "east.runtime._compiler_eastc",
    "east.serialization._beast2_eastc",
    "east.serialization._json_eastc",
    "east.serialization._csv_eastc",
    "east.serialization._east_text_eastc",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top (copyright headers)
    "N802",   # Function names can be PascalCase for type constructors
    "N803",   # Argument names can be uppercase for type parameters (T, K, V, etc.)
    "N806",   # Variable names can be uppercase for constants
    "N812",   # Lowercase imported as non-lowercase (East types)
    "N818",   # Exception naming (ReturnException is intentional)
    "SIM108", # Ternary operator (readability preference)
    "SIM110", # Use all() instead of for loop (readability preference)
    "RET504", # Unnecessary assignment before return (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]  # Allow unused arguments in tests
"east/builtins/*.py" = ["ARG001"]  # Type parameters (T, K, V) passed but not used in body
"east/runtime/*.py" = ["ARG001", "ARG005"]  # Platform functions and lambda arguments
"east/datetime_format/*.py" = ["ARG001"]  # Type parameters
"east/serialization/*.py" = ["ARG005"]  # Lambda arguments in encode/decode functions
"east/**/*_cy.pyx" = ["ALL"]  # Cython files - ruff can't parse .pyx syntax
"east/**/*_eastc.pyx" = ["ALL"]  # east-c Cython files
"east/_eastc_bridge.pyx" = ["ALL"]  # east-c bridge
"east/types/*.py" = ["ARG005"]  # Lambda arguments in type constructors

[tool.coverage.run]
source = ["east"]
omit = ["*/tests/*", "*/tmp/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pydocstyle]
convention = "google"
add-ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__
    "D202",  # No blank lines allowed after function docstring
    "D205",  # 1 blank line required between summary line and description
    "D212",  # Multi-line docstring summary should start at the first line
    "D301",  # Use r""" if any backslashes in a docstring
    "D415",  # First line should end with a period
    "D417",  # Missing argument descriptions (type parameters don't need docs)
]

[tool.bandit]
exclude_dirs = ["tests", "tmp"]
skips = ["B101", "B105", "B311"]  # B101: assert, B105: hardcoded password false positives, B311: random
