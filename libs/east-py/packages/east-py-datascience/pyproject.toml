[project]
name = "elaraai-east-py-datascience"
version = "1.0.113"
description = "East Data Science - ML/optimization platform functions for East Python runtime"
readme = "README.md"
license = { text = "BSL-1.1" }
requires-python = ">=3.12"
dependencies = [
    "elaraai-east-py",
    "numpy>=2.0.0",
]

[tool.uv.sources]
elaraai-east-py = { workspace = true }

# torch and pytorch-lightning are pinned exactly, the same in `torch`,
# `lightning` and `all`, at the versions this workspace's lock holds: a project
# that asks for these extras then locks the torch this release was tested
# with, which is the torch of the release's py-datascience image, and an
# environment a rack runs over that image leaves torch to it (#1662). Move a
# pin with `uv lock --upgrade-package <name>`; scripts/check-version-drift.mjs
# holds the pins to the lock.
#
# xgboost is 3.4.0 or later: its NCCL library is `nvidia-nccl-cu13`, the one
# torch pins. An earlier xgboost asks for `nvidia-nccl-cu12`, which installs
# the same file, `nvidia/nccl/lib/libnccl.so.2`; with it on top `import torch`
# fails (`undefined symbol: ncclCommResume`).
#
# pymc is 6.3.2 or later, with arviz 1.1 or later: pymc 5 reads
# `arviz.InferenceData` as it is imported, which arviz 1.0 removed, and asks
# for no arviz below 1.0, so beside arviz 1.x it does not import. Below Python
# 3.13 the lock holds pymc 6.3.2, not 6.4: pymc 6.4 needs scipy 1.18, and dowhy
# holds scipy at 1.15.3 there.
[project.optional-dependencies]
mads = ["PyNomadBBO>=4.4.0"]
optuna = ["optuna>=4.0.0"]
simanneal = ["simanneal>=0.5.0"]
sklearn = [
    "scikit-learn>=1.4.0,<1.6.0",
    "skl2onnx>=1.17.0",
    "onnxruntime>=1.18.0",
    "cloudpickle>=3.0.0",
]
scipy = [
    "scipy>=1.12.0",
    "cloudpickle>=3.0.0",
]
xgboost = [
    "xgboost>=3.4.0",
    "cloudpickle>=3.0.0",
]
lightgbm = [
    "lightgbm>=4.3.0",
    "cloudpickle>=3.0.0",
]
ngboost = [
    "ngboost>=0.5.0",
    "cloudpickle>=3.0.0",
]
shap = [
    "shap>=0.45.0",
    "cloudpickle>=3.0.0",
]
torch = [
    "torch==2.15.0",
    "cloudpickle>=3.0.0",
]
gp = [
    "scikit-learn>=1.4.0,<1.6.0",
    "cloudpickle>=3.0.0",
]
lightning = [
    "torch==2.15.0",
    "pytorch-lightning==2.6.6",
    "cloudpickle>=3.0.0",
]
mapie = [
    "mapie>=1.2.0",
    "cloudpickle>=3.0.0",
]
alns = [
    "alns>=6.0.0",
]
google-or = [
    "ortools>=9.9",
]
pymc = [
    "pymc>=6.3.2",
    "arviz>=1.1.0",
    "cloudpickle>=3.0.0",
]
causal = [
    "dowhy>=0.12",
    "econml>=0.15.0",
    "PyALE>=1.2.0",
    "statsmodels>=0.14.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "cloudpickle>=3.0.0",
]
all = [
    "PyNomadBBO>=4.4.0",
    "optuna>=4.0.0",
    "simanneal>=0.5.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "skl2onnx>=1.17.0",
    "onnxruntime>=1.18.0",
    "scipy>=1.12.0",
    "xgboost>=3.4.0",
    "lightgbm>=4.3.0",
    "ngboost>=0.5.0",
    "shap>=0.45.0",
    "torch==2.15.0",
    "pytorch-lightning==2.6.6",
    "mapie>=1.2.0",
    "alns>=6.0.0",
    "ortools>=9.9",
    "pymc>=6.3.2",
    "arviz>=1.1.0",
    "dowhy>=0.12",
    "econml>=0.15.0",
    "PyALE>=1.2.0",
    "statsmodels>=0.14.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "cloudpickle>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["scikit-build-core>=0.10", "cython>=3.0.0", "numpy>=1.26.0"]
build-backend = "scikit_build_core.build"

# scikit-build-core drives the build via CMakeLists.txt at this package's
# root. The 2 .pyx files under src/east_py_datascience link against east-c
# (built fresh by this package's CMakeLists). east-py must be installed
# before this package builds — Cython resolves `cimport east._eastc` via
# sys.path.
[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["src/east_py_datascience"]
# built once by `uv sync`, not at import time — see east-py/pyproject.toml.
editable.rebuild = false
editable.verbose = false
build-dir = "build/{wheel_tag}"
# _vendor/ holds east-c + east-py .pxd staged by scripts/vendor-native.py so
# the sdist builds without the monorepo (PyPI install / cibuildwheel container).
sdist.include = ["src/east_py_datascience/**/*.pxd", "src/east_py_datascience/**/*.pyx", "_vendor/**"]
wheel.exclude = ["src/east_py_datascience/**/*.c"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning:torch.cuda",
    "ignore:.*num_workers.*:UserWarning",
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore:.*feature names.*:UserWarning",
    "ignore::DeprecationWarning:sklearn",
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = false

# External optional dependencies - no stubs or incomplete stubs
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*", "sklearn", "sklearn.*", "PyNomad", "optuna", "optuna.*", "simanneal", "skl2onnx", "skl2onnx.*", "onnxruntime", "cloudpickle", "xgboost", "xgboost.*", "lightgbm", "lightgbm.*", "ngboost", "ngboost.*", "shap", "shap.*", "torch", "torch.*", "pytorch_lightning", "pytorch_lightning.*", "lightning", "lightning.*", "onnx", "onnx.*", "mapie", "mapie.*", "alns", "alns.*", "ortools", "ortools.*", "pymc", "pymc.*", "arviz", "arviz.*", "pytensor", "pytensor.*", "dowhy", "dowhy.*", "econml", "econml.*", "PyALE", "PyALE.*", "statsmodels", "statsmodels.*", "pandas", "pandas.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

# Libraries whose public names are assembled at import time (lazy or star
# re-exports); mypy sees an empty module, so treat them as untyped.
[[tool.mypy.overrides]]
module = ["simanneal", "ngboost", "ngboost.*", "shap", "shap.*", "pymc", "pymc.*", "alns", "alns.*"]
follow_imports = "skip"
