[project]
name = "elaraai-east-py-cli"
version = "1.0.44"
description = "Command-line interface for running East IR programs with Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSL-1.1" }
authors = [
    {name = "Elara AI", email = "info@elara.ai"}
]
keywords = ["east", "cli", "runtime", "ir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Environment :: Console",
]

dependencies = [
    "elaraai-east-py",
]

[tool.uv.sources]
elaraai-east-py = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[project.scripts]
east-py = "east_py_cli:main"

[project.urls]
Homepage = "https://github.com/elaraai/east-py"
Documentation = "https://github.com/elaraai/east-py/tree/main/packages/east-py-cli"
Repository = "https://github.com/elaraai/east-py"
Issues = "https://github.com/elaraai/east-py/issues"

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
include = ["east_py_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--verbose"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["east", "east.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]
