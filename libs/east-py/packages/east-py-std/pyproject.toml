[project]
name = "east-py-std"
version = "1.0.0b0"
description = "Standard platform functions for East programming language (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [
    {name = "Elara AI", email = "info@elara.ai"}
]
keywords = ["east", "platform", "stdlib", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
]

dependencies = [
    "east-py",
]

[tool.uv.sources]
east-py = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/elaraai/east-py"
Documentation = "https://github.com/elaraai/east-py/tree/main/packages/east-py-std"
Repository = "https://github.com/elaraai/east-py"
Issues = "https://github.com/elaraai/east-py/issues"

[build-system]
requires = ["scikit-build-core>=0.10", "cython>=3.0.0"]
build-backend = "scikit_build_core.build"

# scikit-build-core drives the build via CMakeLists.txt at this package's
# root. The .pyx files cimport east._eastc — Cython resolves that via
# sys.path, so east-py must be installed before this package builds (the
# workspace dep declared in [project.dependencies] orders this for uv).
[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["east_py_std"]
# built once by `uv sync`, not at import time — see east-py/pyproject.toml.
editable.rebuild = false
editable.verbose = false
build-dir = "build/{wheel_tag}"
sdist.include = ["east_py_std/**/*.pxd", "east_py_std/**/*.pyx"]
wheel.exclude = ["east_py_std/**/*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--verbose"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["east", "east.*", "east_py_std._parallel_eastc"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]
