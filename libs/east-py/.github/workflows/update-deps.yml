name: Update Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # weekly Monday

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "elara-ci[bot]"
          git config user.email "elara-ci[bot]@users.noreply.github.com"

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Update dependencies
        id: update
        working-directory: packages/east-py-datascience
        run: |
          BEFORE_EAST=$(node -p "require('./package-lock.json').packages['node_modules/@elaraai/east'].version")
          BEFORE_STD=$(node -p "require('./package-lock.json').packages['node_modules/@elaraai/east-node-std'].version")
          npm update @elaraai/east @elaraai/east-node-std
          AFTER_EAST=$(node -p "require('./package-lock.json').packages['node_modules/@elaraai/east'].version")
          AFTER_STD=$(node -p "require('./package-lock.json').packages['node_modules/@elaraai/east-node-std'].version")

          echo "before_east=${BEFORE_EAST}" >> $GITHUB_OUTPUT
          echo "after_east=${AFTER_EAST}" >> $GITHUB_OUTPUT
          echo "before_std=${BEFORE_STD}" >> $GITHUB_OUTPUT
          echo "after_std=${AFTER_STD}" >> $GITHUB_OUTPUT

          if git diff --quiet package-lock.json; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Already on latest: east=${BEFORE_EAST}, east-node-std=${BEFORE_STD}"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Updates available: east ${BEFORE_EAST} -> ${AFTER_EAST}, east-node-std ${BEFORE_STD} -> ${AFTER_STD}"
          fi

      - name: Create update branch
        if: steps.update.outputs.has_updates == 'true'
        run: |
          BRANCH_NAME="deps/east-${{ steps.update.outputs.after_east }}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Build TypeScript
        if: steps.update.outputs.has_updates == 'true'
        working-directory: packages/east-py-datascience
        run: npm run build

      - name: Install Python dependencies
        if: steps.update.outputs.has_updates == 'true'
        run: uv sync --all-extras --all-packages

      - name: Run linter
        if: steps.update.outputs.has_updates == 'true'
        id: lint
        run: |
          uv run ruff check packages/
          cd packages/east-py-datascience && npm run lint
        continue-on-error: true

      - name: Export test IR
        if: steps.update.outputs.has_updates == 'true'
        working-directory: packages/east-py-datascience
        run: npm run test:export
        env:
          EXPORT_TEST_IR: /tmp/east-py-datascience

      - name: Run tests
        if: steps.update.outputs.has_updates == 'true'
        id: test
        run: uv run --package east-py-datascience pytest packages/east-py-datascience/tests -v
        continue-on-error: true

      - name: Determine test status
        if: steps.update.outputs.has_updates == 'true'
        id: test_status
        run: |
          if [[ "${{ steps.lint.outcome }}" == "success" && "${{ steps.test.outcome }}" == "success" ]]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=All tests passed" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "message=Tests failed - manual fixes required" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.update.outputs.has_updates == 'true'
        run: |
          git add packages/east-py-datascience/package-lock.json
          git commit -m "deps: update @elaraai/east to ${{ steps.update.outputs.after_east }}, @elaraai/east-node-std to ${{ steps.update.outputs.after_std }}"
          git push -u --force origin "${{ env.branch_name }}"

      - name: Create Pull Request
        if: steps.update.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh label create dependencies --color 0366d6 --description "Dependency updates" 2>/dev/null || true

          EXISTING_PR=$(gh pr list --head "${{ env.branch_name }}" --json number --jq '.[0].number' 2>/dev/null || echo "")

          PR_TITLE="${{ steps.test_status.outputs.emoji }} deps: update @elaraai packages"
          PR_BODY="## Dependency Updates

          | Package | Before | After |
          |---------|--------|-------|
          | \`@elaraai/east\` | \`${{ steps.update.outputs.before_east }}\` | \`${{ steps.update.outputs.after_east }}\` |
          | \`@elaraai/east-node-std\` | \`${{ steps.update.outputs.before_std }}\` | \`${{ steps.update.outputs.after_std }}\` |

          ### Status: ${{ steps.test_status.outputs.emoji }} ${{ steps.test_status.outputs.message }}

          ---
          *This PR was automatically generated by the update-deps workflow.*"

          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --label "dependencies" --head "${{ env.branch_name }}"
          fi
