name: Publish east-py-datascience to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease   # 0.0.2-beta.2 -> 0.0.2-beta.3 (npm tag: beta)
          - prepatch     # 0.0.2-beta.2 -> 0.0.3-beta.0 (npm tag: beta)
          - preminor     # 0.0.2-beta.2 -> 0.1.0-beta.0 (npm tag: beta)
          - premajor     # 0.0.2-beta.2 -> 1.0.0-beta.0 (npm tag: beta)
          - patch        # 0.0.2 -> 0.0.3 (npm tag: latest)
          - minor        # 0.0.2 -> 0.1.0 (npm tag: latest)
          - major        # 0.0.2 -> 1.0.0 (npm tag: latest)
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need write to push version bump and tag
      id-token: write  # Required for npm trusted publishing with OIDC

    defaults:
      run:
        working-directory: packages/east-py-datascience

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "elara-ci[bot]"
          git config user.email "elara-ci[bot]@users.noreply.github.com"
        working-directory: .

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: packages/east-py-datascience/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: .
        run: uv sync --all-extras --all-packages

      - name: Build TypeScript
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Export test IR and run TypeScript tests
        run: npm run test:export
        env:
          EXPORT_TEST_IR: /tmp/east-py-datascience

      - name: Run Python tests
        run: uv run pytest -v

      - name: Determine npm tag
        id: npm_tag
        run: |
          if [[ "${{ inputs.release_type }}" == pre* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: version
        run: |
          if [[ "${{ inputs.release_type }}" == pre* ]]; then
            npm version ${{ inputs.release_type }} --preid=beta --no-git-tag-version
          else
            npm version ${{ inputs.release_type }} --no-git-tag-version
          fi
          echo "new_version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        working-directory: .
        run: |
          git add -A
          git commit -m "chore: bump east-py-datascience to ${{ steps.version.outputs.new_version }}"
          git tag "east-py-datascience-${{ steps.version.outputs.new_version }}"
          git push origin HEAD --tags

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --provenance --tag ${{ steps.npm_tag.outputs.tag }} --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance --tag ${{ steps.npm_tag.outputs.tag }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: east-py-datascience-${{ steps.version.outputs.new_version }}
          name: "@elaraai/east-py-datascience ${{ steps.version.outputs.new_version }}"
          generate_release_notes: true
          prerelease: ${{ steps.npm_tag.outputs.prerelease == 'true' }}
