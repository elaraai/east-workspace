services:
  # ── Test services (shared by east-node and east-py) ─────────────────
  # Start with: docker compose --profile services up -d --wait

  postgres:
    image: postgres:16-alpine
    profiles: [services]
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    profiles: [services]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "testuser", "-ptestpass"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/mysql

  mongodb:
    image: mongo:7
    profiles: [services]
    environment:
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: testpass
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data/db

  redis:
    image: redis:7-alpine
    profiles: [services]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data

  minio:
    # MinIO no longer publishes a public image: Docker Hub's minio/minio is
    # gone, and quay.io/minio/minio refuses anonymous pulls (401 since
    # 2026-09-24). Bitnami's frozen copy is still MinIO — the same server and
    # API — pinned by digest so it never moves. Its own entrypoint starts the
    # server and creates `test-bucket` (MINIO_DEFAULT_BUCKETS) with the `mc`
    # it ships; the `local` alias that setup configures is the healthcheck's.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    profiles: [services]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: test-bucket
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ls", "local/test-bucket"]
      interval: 2s
      timeout: 5s
      retries: 10
      # Setup starts MinIO, creates the bucket, stops it and starts it again.
      start_period: 30s
    tmpfs:
      - /bitnami/minio/data

  ftp:
    image: stilliard/pure-ftpd:latest
    profiles: [services]
    environment:
      PUBLICHOST: "localhost"
      FTP_USER_NAME: "testuser"
      FTP_USER_PASS: "testpass"
      FTP_USER_HOME: "/home/testuser"
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    tmpfs:
      - /home/testuser
      - /etc/pure-ftpd/passwd

  sftp:
    image: atmoz/sftp:latest
    profiles: [services]
    command: testuser:testpass:1001:100:upload
    ports:
      - "2222:22"

  httpbin:
    image: kennethreitz/httpbin:latest
    profiles: [services]
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import http.client; c=http.client.HTTPConnection(\"localhost\",80); c.request(\"GET\",\"/get\"); exit(0 if c.getresponse().status==200 else 1)'"]
      interval: 2s
      timeout: 5s
      retries: 10

