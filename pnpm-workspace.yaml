packages:
  # east — core language
  - "libs/east"

  # east-node — Node.js platform
  - "libs/east-node"
  - "libs/east-node/packages/*"

  # east-c — C runtime (npm launcher for the native binary; the C-only
  # packages under the same dir have no package.json and are skipped).
  - "libs/east-c/packages/*"

  # east-py — Python runtime (TypeScript types package only)
  - "libs/east-py/packages/east-py-datascience"

  # e3 — execution engine
  - "libs/e3"
  - "libs/e3/packages/*"
  - "libs/e3/test/*"

  # east-ui — UI components
  - "libs/east-ui"
  - "libs/east-ui/packages/*"
  - "libs/east-ui/packages/east-ui-extension/webview"

  # create — project scaffolding (create-east, create-e3, scaffold-core).
  # Templates under libs/create/templates are intentionally NOT workspace
  # members: they carry workspace:* as source-of-truth text that the scaffolder
  # rewrites to a pinned version on emit; the create e2e validates them against
  # live code via file: links.
  - "libs/create"
  - "libs/create/packages/*"

  # east-claude-plugin — Claude Code plugin (skills, hooks, MCP search)
  - "libs/east-claude-plugin"

  # east-diagnostics — East-aware diagnostic rules (editor + agent + CI)
  - "libs/east-diagnostics"

  # eslint-plugin-east — ESLint surface for the east-diagnostics rules
  - "libs/eslint-plugin-east"
