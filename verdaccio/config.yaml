storage: /verdaccio/storage
auth:
  htpasswd:
    file: /verdaccio/htpasswd
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  '@elaraai/*':
    access: $all
    publish: $all
    # No uplink — only serves what you publish locally
  '**':
    access: $all
    proxy: npmjs

server:
  keepAliveTimeout: 60

log: { type: stdout, format: pretty, level: warn }
