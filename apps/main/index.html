<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e3 Platform</title>
  <script>
    // Inject tenant context before app loads
    window.__E3_TENANT__ = location.pathname.match(/^\/repos\/([^\/]+)/)?.[1] || null;
    window.__E3_BASE__ = window.__E3_TENANT__ ? `/repos/${window.__E3_TENANT__}` : '';
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
